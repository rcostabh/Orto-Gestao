<style>
:root{
  --bg:#f5f4f2; --surface:#ffffff; --surface-2:#efede9; --ink:#141414; --muted:#6b6862; --line:#e3e0da;
  --accent:#ff6a00; --accent-ink:#0b0b0b; --accent-text:#bf4b00; --accent-soft:#fff0e3; --side:#0b0b0b; --side-ink:#e9e7e3; --side-muted:#8a8680;
  --red:#c62828; --red-soft:#fdeaea; --ok:#1b7a3d; --ok-soft:#e3f5e8; --warn:#9a5b00; --warn-soft:#fff2d9;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 24px rgba(20,20,20,.07);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e0e0e; --surface:#181818; --surface-2:#232323; --ink:#f3f1ed; --muted:#a29e97; --line:#2c2c2c;
    --accent:#ff7a1a; --accent-ink:#0b0b0b; --accent-text:#ff9140; --accent-soft:#34200f; --side:#050505; --side-ink:#e9e7e3; --side-muted:#7d7a74;
    --red:#ff8a80; --red-soft:#3a1c1c; --ok:#6fdc8c; --ok-soft:#14301d; --warn:#ffc266; --warn-soft:#3a2b0d;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e0e0e; --surface:#181818; --surface-2:#232323; --ink:#f3f1ed; --muted:#a29e97; --line:#2c2c2c;
    --accent:#ff7a1a; --accent-ink:#0b0b0b; --accent-text:#ff9140; --accent-soft:#34200f; --side:#050505; --side-ink:#e9e7e3; --side-muted:#7d7a74;
    --red:#ff8a80; --red-soft:#3a1c1c; --ok:#6fdc8c; --ok-soft:#14301d; --warn:#ffc266; --warn-soft:#3a2b0d;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
h1{font:700 24px/1.2 var(--font);letter-spacing:-.02em;margin:0}
h2{font:650 17px/1.25 var(--font);margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
button{font-family:inherit}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 14px var(--font);padding:0 18px;min-height:42px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)} .btn.ghost:hover{filter:none;background:var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)} .wa-ic{display:inline-flex;vertical-align:middle;margin-left:6px;padding:2px;border-radius:8px;line-height:0}.wa-ic svg{width:17px;height:17px}.wa-ic:hover,.wa-ic:focus-visible{background:rgba(37,211,102,.18)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.err{color:var(--red);font-size:13.5px;min-height:1px;margin-top:6px} .err:empty{display:none}
.ok-msg{color:var(--ok);font-size:13.5px}

/* login */
#v-login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 85% -10%,rgba(255,106,0,.28),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(255,106,0,.14),transparent 60%),#0b0b0b}
.login{--surface:#151515;--surface-2:#242424;--ink:#f5f3ef;--muted:#a9a59e;--line:#303030;--accent:#ff6a00;width:100%;max-width:410px;background:#151515;color:var(--ink);border-radius:26px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid #2a2a2a}
.login h1{font-size:30px}
.mark{display:block;flex:none}
.login .logo{display:block;width:min(100%,250px);height:auto;margin:0 0 20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wm{font-weight:800;letter-spacing:-.035em}.wm i{font-style:normal;font-weight:500;color:var(--accent)}
.login h1{margin-bottom:4px}
.form{display:grid;gap:14px;margin-top:22px}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font:400 15px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;min-height:44px;padding:9px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field input[readonly]{background:var(--surface-2)}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.pw{position:relative} .pw input{padding-right:84px}

.pn{display:grid;gap:14px}.pn-top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.pn-top h1{margin:0}.pn-top small{color:var(--muted)}
.pn-al{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pn-a{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.pn-a:hover{transform:translateY(-2px);border-color:var(--accent)}.pn-a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pn-a b{font-size:24px;font-variant-numeric:tabular-nums;grid-row:span 2;min-width:34px;text-align:center}.pn-a span{font-size:13px;font-weight:600}.pn-a small{color:var(--muted);font-size:12px}
.pn-a.r b{color:var(--red)}.pn-a.w b{color:var(--warn)}.pn-a.z{opacity:.7}.pn-a.z b{color:var(--ok)}
.pn-k{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pn-c{min-width:0}.pn-c h2{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pn-n{font-size:clamp(22px,2.3vw,30px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.pn-d{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-top:6px}
.pn-d.up{background:var(--ok-soft);color:var(--ok)}.pn-d.dn{background:var(--red-soft);color:var(--red)}.pn-d.eq{background:var(--surface-2);color:var(--muted)}
.pn-s{font-size:12px;color:var(--muted);margin-top:4px}
.pn-g{display:grid;grid-template-columns:3fr 2fr;gap:12px}.pn-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pn-svg{width:100%;height:auto;display:block}.pn-svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.pn-lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:6px 0 2px;flex-wrap:wrap}.pn-lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--accent)}.pn-lg i.p{background:none;border-top:2px dashed var(--muted);height:0}
.pn-b{display:grid;gap:10px;margin-top:10px}.pn-b>div{display:grid;gap:4px}.pn-bh{display:flex;justify-content:space-between;gap:8px;font-size:13px}.pn-bh span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pn-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}.pn-bar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .7s var(--ease)}
.pn-bar i.ok{background:var(--ok)}.pn-bar i.w{background:var(--warn)}.pn-bar i.r{background:var(--red)}
.pn-conv{font-size:11px;color:var(--muted);margin-top:-2px}
.pn-vz{color:var(--muted);font-size:13px;padding:14px 0}
.pn-sk{height:90px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:pnsk 1.2s linear infinite}@keyframes pnsk{to{background-position:-200% 0}}
.pn-ct{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.pn-ct div{padding:10px;border-radius:12px;background:var(--surface-2)}.pn-ct b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.pn-ct small{color:var(--muted)}
@media(max-width:1000px){.pn-k{grid-template-columns:repeat(2,1fr)}.pn-g,.pn-g2{grid-template-columns:1fr}}
@media(max-width:520px){.pn-k{grid-template-columns:1fr}.pn-ct{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.pn-bar i,.pn-a,.pn-sk{transition:none;animation:none}}
</style>
</head>

const semAcento = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const buscaOkP = p => !p || (p === 'diretor' ? !!EU.acesso_total : p === 'gerencia' ? ehGer() : [].concat(p).some(x => pode(x)));
function buscaIndice(){
  const l = [];
  for (const m of MENU) {
    if (m.r) { if (buscaOkP(m.p)) l.push({ t: m.t, c: 'Menu', r: m.r, k: '' }); }
    else if (m.itens) m.itens.forEach(i => { if (buscaOkP(i.p)) l.push({ t: i.t, c: 'Menu › ' + m.g, r: i.r, k: '' }); });
  }
  BUSCA_EXTRA.forEach(x => { if (buscaOkP(x.p)) l.push(x); });
  return l;
}
function buscaResultados(q){
  const tk = semAcento(q).split(/\s+/).filter(Boolean); if (!tk.length) return [];
  return buscaIndice().map(x => {
    const t = semAcento(x.t), rest = semAcento(x.c + ' ' + (x.k || '')); let sc = 0;
    for (const w of tk) { if (t.startsWith(w) || t.includes(' ' + w)) sc += 3; else if (t.includes(w)) sc += 2; else if (rest.includes(w)) sc += 1; else return null; }
    return { x, sc };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc || a.x.t.localeCompare(b.x.t, 'pt')).slice(0, 8).map(o => o.x);
}
function buscaLiga(){
  const q = $('#bsc-q'), res = $('#bsc-res'); if (!q || q.dataset.ok) return; q.dataset.ok = '1';
  let sel = -1, lista = [];
  const pinta = () => { res.innerHTML = lista.length ? lista.map((x, i) => '<button type="button" class="bsc-i' + (i === sel ? ' on' : '') + '" data-i="' + i + '"><b>' + esc(x.t) + '</b><span>' + esc(x.c) + '</span></button>').join('') : (q.value.trim() ? '<div class="bsc-v">Nada encontrado. Tente outra palavra.</div>' : '');
    $$('.bsc-i', res).forEach(b => b.addEventListener('click', () => vai(lista[Number(b.dataset.i)]))); };
  const vai = x => { if (!x) return; q.value = ''; lista = []; sel = -1; pinta(); irPara(x.r); };
  q.addEventListener('input', () => { lista = buscaResultados(q.value); sel = lista.length ? 0 : -1; pinta(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && lista.length) { e.preventDefault(); sel = (sel + 1) % lista.length; pinta(); }
    else if (e.key === 'ArrowUp' && lista.length) { e.preventDefault(); sel = (sel - 1 + lista.length) % lista.length; pinta(); }
    else if (e.key === 'Enter') { e.preventDefault(); vai(lista[Math.max(sel, 0)]); }
    else if (e.key === 'Escape') { q.value = ''; lista = []; sel = -1; pinta(); }
  });
}

  ['0.42.0', '2026-11-05', 'Clínico virou grupo no menu lateral (Orçamentos, Procedimentos clínicos, Materiais, Compras, Configuração). Venda e cobrança valem só para a ortodontia. Ficha do prospect: Editar cadastro dentro de Mais ações. Orçamento clínico: mostra o dentista e esconde valores de quem não negocia (só divulgação e diretoria veem). Início do gerente e do diretor: vendas e cobrança do mês até hoje, comparação com o mesmo período do mês anterior, média diária de venda e projeção do mês pelos dias úteis. Tipos de lançamento classificados como venda ou cobrança. Dentista: especialidade, "também faz clínico" e comissão própria. Clínico: busca de paciente para iniciar orçamento.'],
  ['0.41.0', '2026-11-04', 'Composição de preço no módulo Clínico: o sistema calcula o preço ideal de cada serviço a partir dos materiais, do protético, das comissões de vendas e do dentista, dos impostos e da margem mínima desejada (padrão 23%, configurável), mostra em vermelho os serviços abaixo da margem e avisa no orçamento quando o valor negociado fica abaixo dela.'],
  ['0.40.0', '2026-11-04', 'Módulo Clínico (etapa 1): catálogo de serviços e materiais importados da planilha, custo e margem por serviço, notas de compra que atualizam estoque e custo, orçamento clínico (o dentista indica, o comercial negocia de valor até o mínimo), desconto abaixo do mínimo só com login e senha de diretor e simulador de financiamento pela tabela price com a regra de liberação do tratamento.'],
  ['0.39.0', '2026-11-04', 'Carta de alta só pelo dentista: o botão Carta de alta (passar para contenção) só aparece para quem é dentista, e o banco recusa a mudança de quem não for. Recepção, cobrança e gerência que não atendem como dentista não dão mais alta.'],
  ['0.38.0', '2026-11-04', 'Ícone do WhatsApp ao lado dos telefones: um toque abre a conversa direto com o paciente (e com funcionários e unidades) no WhatsApp. Aparece nas listas de pacientes e faltas, na ficha do paciente, na Cobrança (régua, sem agendamento e faltas), no caixa e nos cadastros. Quem vê o telefone mascarado não ganha o ícone, para não revelar o número.'],
  ['0.37.0', '2026-11-03', 'Central de Comunicação (WhatsApp pela API oficial da Meta), fase 1. Novo item Comunicação no menu, com quatro abas: Enviar (busca pacientes por situação, faixa da régua de cobrança, vencimento da parcela e falta de consulta marcada, escolhe um modelo aprovado e envia agora ou agenda), Modelos (cria os textos, envia à Meta e acompanha a aprovação), Histórico (fila, enviada, entregue, lida e falha, com cancelamento do que ainda não saiu) e Conexão (gerência informa a conta e o número de cada unidade). Quem recusou o WhatsApp nunca recebe e o intervalo mínimo entre mensagens iguais continua valendo. O token da Meta fica só nos segredos do Supabase. Precisa do SQL 39 e das duas funções do Supabase (guia de conexão).'],
  ['0.36.0', '2026-11-03', 'Situações do paciente simplificadas: Prospecção, Pré-Ativo, Ativo, Inativo e Contenção. O cancelamento do contrato agora deixa o paciente Inativo (antes era Desistente) e as situações Concluído e Desistente deixaram de existir; quem estava nelas passa a Inativo. A alta continua levando para Contenção. Um Inativo que teve o contrato cancelado pode ser reaberto como prospect para uma nova venda.'],

  ['0.34.0', '2026-11-03', 'Venda avulsa: para quem compra um produto ou serviço sem fazer o tratamento (clareamento, limpeza profunda...). Em Vendas, o botão Venda avulsa escolhe o paciente (até prospect), o produto, o valor e a forma de pagamento e já registra o recebimento no caixa, sem contrato e sem mensalidades. Nova aba Avulsas lista essas vendas, e a ficha do paciente também tem o botão.'],

  ['0.13.0', '2026-11-01', 'Mais ações na ficha com Cancelar contrato (Gerente e Diretor cancelam; os demais solicitam e a gerência decide). Estorno de pagamento (Gerente e Diretor; sai do caixa de quem estorna). Isenção de parcela (só o Diretor; os demais pedem com observação) e nova tela Solicitações com aprovação uma a uma e isenção geral. O botão Desistiu foi retirado.'],

const APP_VERSAO = VERSOES[0][0];
$('#ver').textContent = 'v' + APP_VERSAO;
$('#ver').addEventListener('click', () => {
  abrirJanela('Registro de versões', '<div class="db"><div class="vl">' + VERSOES.map(v => '<div><b>v' + v[0] + '</b>' + (v[1] ? '<small>' + dBR(v[1]) + '</small>' : '') + '<p>' + esc(v[2]) + '</p></div>').join('') + '</div></div><div class="df"><button class="btn" type="button" id="vx">Fechar</button></div>');
  $('#vx').addEventListener('click', fecharJanela);
});

/* ---------- unidade ativa: a pessoa vê uma unidade por vez ---------- */
let UN = null; const MINHAS = [];
function defUn(todas){
  const m = (todas || []).filter(u => u.ativa && (EU.acesso_total || (EU.unidades || []).includes(u.id)));
  MINHAS.length = 0; MINHAS.push(...m);
  if (!MINHAS.some(u => u.id === UN)) { let sv = null; try { sv = Number(localStorage.getItem('og_un_' + (EU.id || EU.login))); } catch (_) {} UN = (MINHAS.find(u => u.id === sv) || MINHAS[0] || {}).id || null; }
  desenhaUn();
}
function desenhaUn(){
  const el = $('#und'), nm = u => esc(u.sigla) + ' — ' + esc(u.razao_social);
  if (EU.fora) { el.innerHTML = '<span class="ul">Plataforma</span><b>' + esc(EU.perfil) + '</b>'; return; }
  if (!MINHAS.length) { el.innerHTML = '<span class="ul">Unidade</span><b>Sem unidade vinculada</b>'; return; }
  if (MINHAS.length === 1) { el.innerHTML = '<span class="ul">Unidade</span><b>' + nm(MINHAS[0]) + '</b>'; return; }
  el.innerHTML = '<label class="ul" for="un-sel">Unidade</label><select id="un-sel">' + MINHAS.map(u => '<option value="' + u.id + '"' + (u.id === UN ? ' selected' : '') + '>' + nm(u) + '</option>').join('') + '</select>';
  $('#un-sel').addEventListener('change', e => trocarUnidade(Number(e.target.value)));
}
const semUn = t => '<div class="head"><h1>' + t + '</h1></div><div class="card"><div class="vazio">' + (ehDir() ? 'Nenhuma unidade cadastrada ainda. A primeira unidade é cadastrada pelo gestor da plataforma.' : 'Você ainda não está vinculado a nenhuma unidade. Peça a um Diretor para vincular você em Funcionários.') + '</div></div>';
function trocarUnidade(id){
  FILA = FILA.then(async () => {
    if (id === UN) return;
    if (ABA) { try { await ABA.pronto; } catch (_) {} }
    UN = id; try { localStorage.setItem('og_un_' + (EU.id || EU.login), String(id)); } catch (_) {}
    desenhaUn(); AV.vistos = null; AV.lista = []; avBuscar();
    const eraFicha = ABA && ABA.rota === 'paciente'; if (eraFicha) $('#area').replaceChildren();
    const resto = ABAS.filter(a => a.rota !== 'paciente'); ABAS.length = 0; ABAS.push(...resto);
    if (eraFicha) mostrar(ABAS.find(a => a.rota === 'prospects') || ABAS[0]); else renderAbas();
    if (precisa(ABA)) recarregar(ABA);
    try { await ABA.pronto; } catch (_) {}
    toast('Unidade: ' + (MINHAS.find(u => u.id === id) || {}).sigla);
  }).catch(() => {});
  return FILA;
}

/* ---------- CEP: busca o endereço (base dos Correios, via ViaCEP) ao terminar de digitar ---------- */
async function cepAuto(p, cep){
  const msg = $('#' + p + '-cepmsg'); if (!msg) return;
  msg.textContent = 'Buscando o endereço...';
  try {
    const r = await fetch('https://viacep.com.br/ws/' + cep + '/json/'); const j = await r.json();
    if (dig(($('#' + p + '-cep') || {}).value) !== cep) return;
    if (j.erro) { msg.textContent = 'CEP não encontrado. Confira os números ou preencha o endereço à mão.'; return; }
    [[p + '-log', j.logradouro], [p + '-bai', j.bairro], [p + '-cid', j.localidade]].forEach(([id, v]) => { if (v) $('#' + id).value = v; });
    if (j.uf) $('#' + p + '-uf').value = j.uf;
    { const ib = $('#nf-ibge'); if (ib && !ib.disabled && j.ibge) ib.value = j.ibge; }
    msg.textContent = 'Endereço preenchido pelo CEP. Confira e informe o número.';
    const n = $('#' + p + '-num'); if (n && !n.disabled) n.focus();
  } catch (_) { msg.textContent = 'Não consegui consultar o CEP agora. Preencha o endereço à mão.'; }
}

      if (l.i.value && !(l.a.value < l.i.value && l.i.value < l.v.value && l.v.value < l.f.value)) { er.textContent = 'Confira o almoço de ' + nome + ': ele precisa começar depois da abertura, terminar antes do fechamento e a volta tem que ser depois da saída.'; return; }
      horario[d[0]] = l.i.value ? { abre: l.a.value, almoco_ini: l.i.value, almoco_fim: l.v.value, fecha: l.f.value } : { abre: l.a.value, fecha: l.f.value }; }
    const sigla = v('u-sigla');
    if (v('u-razao').length < 3) { er.textContent = 'Informe a razão social.'; return; }
    if (!/^[A-Z0-9]{2,8}$/.test(sigla)) { er.textContent = 'A sigla precisa ter de 2 a 8 letras ou números.'; return; }
    if (dig(v('u-cnpj')) && !cnpjOk(v('u-cnpj'))) { er.textContent = 'CNPJ inválido. Confira os 14 números.'; return; }
    if (dig(v('u-tel')).length < 10) { er.textContent = 'Informe o telefone com DDD.'; return; }
    if (!v('u-log') || !v('u-num') || !v('u-cid') || !v('u-uf')) { er.textContent = 'Preencha rua, número, cidade e UF.'; return; }
    if (!Object.keys(horario).length) { er.textContent = 'Marque pelo menos um dia de funcionamento.'; return; }
    const reg = { razao_social: v('u-razao'), cnpj: dig(v('u-cnpj')) || null, sigla, telefone: dig(v('u-tel')), cep: dig(v('u-cep')) || null, logradouro: v('u-log'), numero: v('u-num'), complemento: v('u-comp') || null, bairro: v('u-bai') || null, cidade: v('u-cid'), uf: v('u-uf'), horario };
    const b = $('#u-ok'); b.disabled = true;
    const { error } = novo ? await sb.from('unidades').insert(reg) : await sb.from('unidades').update(reg).eq('id', u.id);
    if (!error && !novo && NFC) { const r = await sb.rpc('nf_config_salvar', { p_unidade: u.id, p_cfg: nfLer(), p_token: ($('#nf-token').value || '').trim() || null }); if (r.error) { b.disabled = false; er.textContent = erroTxt(r.error); return; } }
    b.disabled = false;
    if (error) { er.textContent = erroTxt(error); return; }
    fecharJanela(); toast(novo ? 'Unidade cadastrada.' : 'Unidade atualizada.'); uniCarregar();
  });
}

async function funCarregar(){

  if (er) { $('#area').innerHTML = '<div class="card"><div class="err">' + esc(erroTxt(er)) + '</div></div>'; return; }
  D.ext = rs[4].error ? [] : (rs[4].data || []); D.conv = rs[5].error ? [] : (rs[5].data || []).filter(x => x.papel === 'enviado');
  D.fu = rs[1].data; D.unidades = rs[2].data; D.perfis = rs[3].data; defUn(D.unidades);

}

const PER = { sel: null };
async function perCarregar(){

  if (PER.sel !== 'novo' && !D.perfis.some(p => p.id === PER.sel)) PER.sel = D.perfis[0] && D.perfis[0].id;

function perDesenhar(){

    + (gerir ? '<button class="btn ghost sm" type="button" id="p-novo" style="margin-top:12px;width:100%">+ Novo perfil</button>' : '') + '</div>'
    + '<div class="card"><form id="p-form" novalidate><div class="g2"><label class="field" for="p-nome">Nome do perfil<input id="p-nome" maxlength="40" value="' + esc(p.nome) + '"' + (nomeTrava ? ' disabled' : '') + '></label><label class="field" for="p-desc">Descrição<input id="p-desc" maxlength="120" value="' + esc(p.descricao) + '"' + (trava ? ' disabled' : '') + '></label></div>'

      + m.l.map(x => '<label class="chk"><input type="checkbox" class="pm" data-m="' + esc(m.n) + '" value="' + esc(x.codigo) + '"' + (p.acesso_total || marc.has(x.codigo) ? ' checked' : '') + (trava ? ' disabled' : '') + '> ' + esc(x.rotulo) + '</label>').join('') + '</div>').join('') + '</div>'

  $$('[data-mod]').forEach(b => b.addEventListener('click', () => { const cs = $$('.pm[data-m="' + b.dataset.mod + '"]'); const todas = cs.every(c => c.checked); cs.forEach(c => c.checked = !todas); b.textContent = todas ? 'Marcar todas' : 'Desmarcar todas'; }));

    b.disabled = false; PER.sel = id; toast(novo ? 'Perfil criado.' : 'Perfil salvo.'); perCarregar();
  });
}

    const sn = (n, t) => '<div class="field" role="radiogroup" aria-label="' + t + '"><span>' + t + ' *</span><div class="chks"><label class="chk"><input type="radio" name="' + n + '" value="1"> Sim</label><label class="chk"><input type="radio" name="' + n + '" value="0"> Não</label></div></div>';
    abrirJanela('Concluir avaliação', '<form id="ac-form" novalidate><div class="db"><p style="margin:0"><b>' + esc(nome) + '</b> <span class="sub">avaliação feita por você, identificada no cadastro do paciente</span></p>'
      + '<div class="field" role="radiogroup" aria-label="Resultado"><span>Resultado da avaliação *</span><div class="chks"><label class="chk"><input type="radio" name="ac-apto" value="1"> Apto</label><label class="chk"><input type="radio" name="ac-apto" value="0"> Não apto</label></div></div>'
      + sn('ac-cli', 'Tratamento clínico concomitante?') + sn('ac-lim', 'Limpeza profunda inicial?')
      + '<label class="field" for="ac-obs">Observação <small>(opcional)</small><textarea id="ac-obs" rows="3" maxlength="1000"></textarea></label><p class="sub" style="margin:0">Apto libera o paciente para a venda de um plano de tratamento.</p><div class="err" id="ac-err" role="alert"></div></div><div class="df"><button class="btn ghost" type="button" id="ac-cancel">Cancelar</button><button class="btn" type="submit" id="ac-ok">Concluir</button></div></form>');
    $('#ac-cancel').addEventListener('click', fecharJanela);
    $('#ac-form').addEventListener('submit', async ev => {
      ev.preventDefault(); const er = $('#ac-err'); er.textContent = '';
      const v = n => { const x = $('input[name="' + n + '"]:checked'); return x ? x.value === '1' : null; };
      if (v('ac-apto') === null) { er.textContent = 'Marque se o paciente está apto ou não apto.'; return; }
      if (v('ac-cli') === null || v('ac-lim') === null) { er.textContent = 'Responda as duas perguntas: tratamento clínico concomitante e limpeza profunda inicial.'; return; }
      $('#ac-ok').disabled = true; const r = await sb.rpc('concluir_avaliacao', { p_id: id, p_apto: v('ac-apto'), p_clinico: v('ac-cli'), p_limpeza: v('ac-lim'), p_obs: $('#ac-obs').value });
      $('#ac-ok').disabled = false; if (r.error) { er.textContent = erroTxt(r.error); return; }
      fecharJanela(); toast(v('ac-apto') ? 'Avaliação concluída: paciente apto, liberado para venda.' : 'Avaliação concluída: paciente não apto.'); avBuscar(); if (ROTA_ATIVA() === 'vendas') vdCarregar(); if (aoFim) aoFim();
    });
}
const avClique = async e => {
  const at = e.target.closest('[data-atender]'), co = e.target.closest('[data-concluir]'), ab = e.target.closest('[data-abrir]');
  if (ab) { const a = AV.lista.find(x => x.paciente_id === Number(ab.dataset.abrir)); irPara('paciente', { chave: 'paciente:' + a.paciente_id, titulo: (a.nome_social || a.paciente_nome).split(' ').slice(0, 2).join(' '), id: a.paciente_id }); return; }
  if (at) { at.disabled = true; const r = await sb.rpc('atender_avaliacao', { p_id: Number(at.dataset.atender) }); if (r.error) { toast(erroTxt(r.error)); } else toast('Avaliação em atendimento.'); await avBuscar(); return; }
  if (co) { const id = Number(co.dataset.concluir), a = AV.lista.find(x => x.id === id); avConcluirDialogo(id, a.paciente_nome); }
};

function docReduz(f){
  return new Promise(res => {
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return res(f);
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { URL.revokeObjectURL(url); const m = Math.max(img.width, img.height), k = Math.min(1, 2400 / m);
      if (k === 1 && f.size <= 2.5 * 1024 * 1024) return res(f);
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b && b.size < f.size ? b : f), 'image/jpeg', .86); };
    img.onerror = () => { URL.revokeObjectURL(url); res(f); }; img.src = url;
  });
}
/* envia os arquivos para o armazenamento privado e registra na ficha */
async function docEnviar(p, arquivos, o, prog){
  let ok = 0; const erros = [];
  for (let i = 0; i < arquivos.length; i++) {
    const f = arquivos[i]; if (prog) prog(i + 1, arquivos.length);
    try {
      const b = await docReduz(f), mime = b.type === 'image/jpeg' || /^image\/(png|webp|heic|heif)$/.test(b.type) || b.type === 'application/pdf' ? b.type : (f.type || 'image/jpeg');
      if (b.size > 15 * 1024 * 1024) throw new Error('O arquivo "' + f.name + '" passa de 15 MB.');
      const caminho = p.grupo_id + '/' + p.id + '/' + docUuid() + '.' + docExt(mime, f.name);
      const up = await sb.storage.from(DOC_BUCKET).upload(caminho, b, { contentType: mime, upsert: false }); if (up.error) throw up.error;
      const rg = await sb.rpc('documento_registrar', { p_paciente: p.id, p_categoria: o.categoria, p_tipo: o.tipo, p_momento: o.momento, p_caminho: caminho, p_nome: f.name || 'foto.jpg', p_mime: mime, p_tamanho: b.size, p_origem: o.origem || 'sistema', p_obs: o.obs || null });
      if (rg.error) { try { await sb.storage.from(DOC_BUCKET).remove([caminho]); } catch (x) {} throw rg.error; }
      ok++;
    } catch (e) { erros.push(erroTxt(e)); }
  }
  return { ok, erros };
}

async function contratoAbrir(vendaId){

  const q = relNorm(CB.q.trim()); let l = CB.dados.filter(x => CB.regua === 'todas' || x.regua === CB.regua);
  if (q) l = l.filter(x => relNorm(x.paciente_nome).includes(q));
  if (CB.vi) l = l.filter(x => (x.venc_antigo || x.proximo_venc || '') >= CB.vi); if (CB.vf) l = l.filter(x => (x.venc_antigo || x.proximo_venc || '9999') <= CB.vf);
  const rg = k => REGUAS.find(r => r[0] === k), baixa = pode('financeiro.baixar');
  $('#cb-body').innerHTML = l.length ? l.map(x => '<tr><td><button class="link" type="button" data-pac="' + x.paciente_id + '" data-nm="' + esc(x.paciente_nome) + '">' + esc(x.paciente_nome) + '</button></td><td>' + (x.telefone ? mTel(x.telefone) + waIc(x.telefone, x.paciente_nome) : '—') + '</td><td>' + esc(x.status) + '</td>'
    + '<td><span class="pill ' + rg(x.regua)[3] + '">' + rg(x.regua)[1] + '</span></td><td class="n">' + x.qtd_atraso + '</td><td class="n">' + reais(x.valor_atraso) + '</td><td class="n">' + reais(x.a_vencer_mes) + '</td><td>' + (x.venc_antigo ? dBR(x.venc_antigo) : '—') + '</td><td class="n">' + (x.dias_atraso > 0 ? x.dias_atraso : '—') + '</td>'
    + '<td>' + (x.ultimo_pgto ? dBR(x.ultimo_pgto) + '<br><small style="color:var(--muted)">' + reais(x.ultimo_valor) + '</small>' : '—') + '</td><td>' + esc(x.plano) + '</td><td>' + (baixa ? '<button class="btn sm" type="button" data-rec="' + x.paciente_id + '">Receber</button>' : '') + '</td></tr>').join('')
    : '<tr><td colspan="12" class="vazio">Nenhum paciente nesta régua.</td></tr>';
  const sm = f => Math.round(l.reduce((t, x) => t + Number(f(x)), 0) * 100) / 100;
  $('#cb-tot').innerHTML = '<td colspan="4">Totais · ' + l.length + (l.length === 1 ? ' paciente' : ' pacientes') + (l.length !== CB.dados.length ? ' de ' + CB.dados.length : '') + '</td><td class="n">' + l.reduce((t, x) => t + x.qtd_atraso, 0) + '</td><td class="n">' + reais(sm(x => x.valor_atraso)) + '</td><td class="n">' + reais(sm(x => x.a_vencer_mes)) + '</td><td colspan="5"></td>';
  $$('#cb-body [data-pac]').forEach(b => b.addEventListener('click', () => abrirPaciente({ id: Number(b.dataset.pac), nome: b.dataset.nm, nome_social: null })));
  $$('#cb-body [data-rec]').forEach(b => b.addEventListener('click', () => caixaPaciente(Number(b.dataset.rec))));
}

/* ---------- COBRANÇA: abas Sem agendamento, Faltas e Campanhas (fila de WhatsApp de 1 toque) ---------- */
const CBX = { aba: null, cfg: null, procs: [], camp: [], fila: null, fl: null, aut: null };
const CB_RES = [['enviado', 'Enviado'], ['agendou', 'Agendou'], ['sem_resposta', 'Sem resposta'], ['numero_errado', 'Número errado'], ['nao_quer', 'Não quer']];
const CB_BLOQ = { sem_telefone: 'Sem telefone', recusou: 'Recusou WhatsApp', sem_autorizacao: 'Sem autorização' };
const CB_WPP = { sim: ['on', 'Autorizado'], nao: ['off', 'Recusou'], sem_registro: ['wr', 'Sem registro'] };
const CB_VARS = [['primeiro_nome', 'Primeiro nome'], ['nome', 'Nome completo'], ['unidade', 'Unidade'], ['ultima_visita', 'Última visita'], ['procedimento', 'Procedimento'], ['valor_em_atraso', 'Valor em atraso'], ['data_falta', 'Data da falta']];
const CB_STATUS = ['Ativo', 'Pré-Ativo', 'Contenção', 'Inativo'];
const CB_REGUAS = [['preventivo', 'Preventiva'], ['cob0', 'Cob 0'], ['cob30', 'Cob 30'], ['cob60', 'Cob 60'], ['cob90', 'Cob 90'], ['mais90', '+90']];
const waNum = t => { let d = dig(t); if (d.length === 10 || d.length === 11) d = '55' + d; return d; };
const cbCap = s => String(s || '').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
const cbUnNome = () => { const u = MINHAS.find(x => x.id === UN) || {}; return u.razao_social || u.sigla || 'a clínica'; };
const cbDias = d => { if (!d) return null; return Math.round((Date.parse(hoje() + 'T00:00:00') - Date.parse(d + 'T00:00:00')) / 86400000); };
function cobMsg(tpl, x, ex){
  ex = ex || {}; const nm = x.nome || x.paciente_nome || '', pn = cbCap(nm.trim().split(/\s+/)[0] || nm), uf = x.ultima_visita, df = x.data || x.ultima_falta;
  const v = { primeiro_nome: pn, nome: cbCap(nm), unidade: cbUnNome(), ultima_visita: uf ? dBR(uf) : 'sua última consulta', procedimento: ex.procedimento || 'o procedimento',
              valor_em_atraso: x.valor_atraso != null ? String(Number(x.valor_atraso).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })) : '', data_falta: df ? dBR(df) : 'sua consulta' };
  return String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
}
function cobAbasHtml(){
  const ver = pode('cobranca.ver') || pode('financeiro.ver'), con = pode('cobranca.contatar');
  const t = [['regua', 'Régua de cobrança', ver], ['semag', 'Sem agendamento', con], ['faltas', 'Faltas', con], ['camp', 'Campanhas', con], ['semcont', 'Sem contato', con]].filter(a => a[2]);
  return '<div class="tools" id="cb-nav" role="tablist" style="margin-top:4px">' + t.map(a => '<button class="btn ' + (CBX.aba === a[0] ? '' : 'ghost ') + 'sm" type="button" role="tab" aria-selected="' + (CBX.aba === a[0]) + '" data-cba="' + a[0] + '">' + a[1] + '</button>').join(' ') + '</div>';
}
function cobAbasLiga(){ $$('#cb-nav [data-cba]').forEach(b => b.addEventListener('click', () => { CBX.aba = b.dataset.cba; CBX.fila = null; cobCarregar(); })); }
const cbCabeca = sub => '<div class="head"><div><h1>Cobrança</h1><p class="sub">' + sub + '</p></div></div>' + cobAbasHtml();
async function cobOutra(){
  const rs = await Promise.all([sb.rpc('cobranca_config_ler'), sb.from('procedimentos').select('id,nome').eq('ativo', true).order('nome')]);
  const er = rs.map(r => r.error).find(Boolean); if (er) { $('#area').innerHTML = '<div class="card"><div class="err">' + esc(erroTxt(er)) + '</div></div>'; return; }
  CBX.cfg = rs[0].data; CBX.procs = rs[1].data || [];
  if (CBX.aba === 'semag') return cbSemAg(); if (CBX.aba === 'faltas') return cbFaltas(); if (CBX.aba === 'semcont') return cbSemContato(); return cbCampanhas();
}

/* ----- botão de envio, resultado e registro do contato (comum às três abas) ----- */
function cbAcao(x, msg){
  if (x.bloqueio) return '<span class="pill off" title="' + (x.bloqueio === 'sem_autorizacao' ? 'A empresa exige autorização de WhatsApp e o paciente não tem registro. Registre na ficha do paciente.' : x.bloqueio === 'recusou' ? 'O paciente revogou o contato por WhatsApp.' : 'Cadastre o telefone na ficha do paciente.') + '">' + CB_BLOQ[x.bloqueio] + '</span>';
  return '<a class="btn sm" href="https://wa.me/' + waNum(x.telefone) + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener" data-env="' + x.paciente_id + '">' + (x.ultimo_contato ? 'Enviar de novo' : 'Enviar WhatsApp') + '</a>';
}
function cbUltimo(x){
  if (!x.ultimo_contato) return '<span style="color:var(--muted)">Nunca</span>';
  const d = new Date(x.ultimo_contato).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }), n = cbDias(d);
  return dBR(d) + ' <small style="color:var(--muted)">' + (n === 0 ? 'hoje' : n === 1 ? 'ontem' : 'há ' + n + ' d') + '</small><br><select class="cbres" data-cid="' + x.ultimo_contato_id + '" aria-label="Resultado do contato">' + CB_RES.map(r => '<option value="' + r[0] + '"' + (r[0] === x.ultimo_resultado ? ' selected' : '') + '>' + r[1] + '</option>').join('') + '</select>';
}
function cbLigaEnvio(root, get, origem, campanha, tplFn, depois){
  root.addEventListener('click', async e => {
    const a = e.target.closest('[data-env]'); if (!a) return; const x = get(Number(a.dataset.env)); if (!x || x._busy) return; x._busy = true;
    const r = await sb.rpc('cobranca_registrar_contato', { p_paciente: x.paciente_id, p_origem: origem, p_campanha: campanha || null, p_mensagem: tplFn(x) });
    x._busy = false; if (r.error) { toast('O WhatsApp abriu, mas o contato não foi registrado: ' + erroTxt(r.error)); return; }
    x.ultimo_contato = new Date().toISOString(); x.ultimo_resultado = 'enviado'; x.ultimo_contato_id = r.data; x._sessao = true; toast('Contato registrado.'); depois();
  });
  root.addEventListener('change', async e => {
    const s = e.target.closest('.cbres'); if (!s) return; s.disabled = true;
    const r = await sb.rpc('cobranca_contato_resultado', { p_id: Number(s.dataset.cid), p_resultado: s.value }); s.disabled = false;
    if (r.error) { toast(erroTxt(r.error)); return; } const x = get(null, Number(s.dataset.cid)); if (x) x.ultimo_resultado = s.value; toast('Resultado salvo.'); depois(true);
  });
  root.addEventListener('click', e => { const l = e.target.closest('[data-pac]'); if (l) abrirPaciente({ id: Number(l.dataset.pac), nome: l.dataset.nm, nome_social: null }); });
}
const cbConfigBtn = () => pode('cobranca.campanhas') ? '<button class="btn ghost sm" type="button" id="cb-cfg">Mensagens e regras</button>' : '';
const cbCfgLiga = () => { const b = $('#cb-cfg'); if (b) b.addEventListener('click', cbConfigDialogo); };

/* ----- fila (lista do dia): serve para Sem agendamento e para cada campanha ----- */
async function cbFila(cfg){
  CBX.fila = { cfg, dados: [], q: '', ocultar: true, conv: null };
  $('#area').innerHTML = cbCabeca(cfg.sub) + '<div class="card"><p class="sub">Carregando...</p></div>';
  const rs = await Promise.all([sb.rpc('cobranca_publico', { p_unidade: UN, p_filtro: cfg.filtro }), sb.rpc('cobranca_contatos', { p_unidade: UN, p_de: somaDias(hoje(), -30), p_ate: hoje() })]);
  const er = rs.map(r => r.error).find(Boolean); if (er) { $('#area').innerHTML = cbCabeca(cfg.sub) + '<div class="card"><div class="err">' + esc(erroTxt(er)) + '</div></div>'; cobAbasLiga(); return; }
  const F = CBX.fila; F.dados = rs[0].data || [];
  const ct = (rs[1].data || []).filter(c => c.origem === cfg.origem && (cfg.origem !== 'campanha' || c.campanha_nome === cfg.titulo)); F.conv = { n: ct.length, ok: ct.filter(c => c.agendou_depois || c.resultado === 'agendou').length };
  cbFilaTela();
}
function cbFilaTela(){
  const F = CBX.fila, cfg = F.cfg;
  $('#area').innerHTML = cbCabeca(cfg.sub)
    + (cfg.voltar ? '<div class="tools" style="margin:0 0 10px"><button class="btn ghost sm" type="button" id="cb-volta">← Campanhas</button></div>' : '')
    + '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h2 style="margin:0;font-size:17px">' + esc(cfg.titulo) + '</h2>' + cbConfigBtn() + '</div>'
    + '<p class="sub" style="margin:6px 0 10px">' + esc(cfg.regra || '') + '</p>'
    + '<details style="margin:0 0 12px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Mensagem que será enviada</summary><p id="cb-msg" style="margin:8px 0 0;white-space:pre-wrap;font-size:14.5px"></p><p class="sub" style="margin:6px 0 0">O nome e os dados de cada paciente entram automaticamente.</p></details>'
    + '<div class="kpis" id="cb-kpis"></div><p class="sub" id="cb-conv" style="margin:0 0 12px"></p>'
    + '<div class="tools"><input id="cb-fq" type="search" placeholder="Buscar paciente" aria-label="Buscar paciente" value="' + esc(F.q) + '"><label class="chk" style="flex:none"><input type="checkbox" id="cb-oc"' + (F.ocultar ? ' checked' : '') + '> Ocultar quem recebeu mensagem nos últimos ' + (CBX.cfg.cooldown_dias || 0) + ' dias</label></div>'
    + '<div class="rlg" id="cb-ftab"><table class="tb rl"><thead><tr><th>Paciente</th><th>Telefone</th><th>WhatsApp</th><th>' + (cfg.col2 || 'Última visita') + '</th><th>Último contato</th><th>Enviar</th></tr></thead><tbody id="cb-fbody"></tbody></table></div></div>';
  $('#cb-msg').textContent = cfg.tpl;
  cobAbasLiga(); cbCfgLiga(); const vb = $('#cb-volta'); if (vb) vb.addEventListener('click', () => { CBX.fila = null; cbCampanhas(); });
  $('#cb-fq').addEventListener('input', e => { F.q = e.target.value; cbFilaCorpo(); }); $('#cb-oc').addEventListener('change', e => { F.ocultar = e.target.checked; cbFilaCorpo(); });
  const tpl = x => cobMsg(cfg.tpl, x, cfg.extra);
  cbLigaEnvio($('#cb-fbody'), (pid, cid) => F.dados.find(x => cid ? x.ultimo_contato_id === cid : x.paciente_id === pid), cfg.origem, cfg.campanha, tpl, () => cbFilaCorpo());
  cbFilaCorpo();
}
function cbOculto(x, F){
  if (!F.ocultar || x._sessao || !x.ultimo_contato || !CBX.cfg.cooldown_dias) return false;
  return (Date.now() - Date.parse(x.ultimo_contato)) < CBX.cfg.cooldown_dias * 86400000;
}
function cbFilaCorpo(){
  const F = CBX.fila, cfg = F.cfg, q = relNorm(F.q.trim()), h = hoje(), d = F.dados;
  const hojeCt = x => x.ultimo_contato && new Date(x.ultimo_contato).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }) === h;
  const liv = d.filter(x => !x.bloqueio && !cbOculto(x, F)), vis = d.filter(x => !cbOculto(x, F) && (!q || relNorm(x.nome).includes(q)));
  $('#cb-kpis').innerHTML = [['Na lista', d.length, ''], ['Contatados hoje', d.filter(hojeCt).length, 'ok'], ['Para contatar agora', liv.filter(x => !hojeCt(x)).length, liv.some(x => !hojeCt(x)) ? 'al' : 'ok'], ['Sem como contatar', d.filter(x => x.bloqueio).length, '']]
    .map(k => '<div class="kpi ' + k[2] + '"><span>' + k[0] + '</span><b>' + k[1] + '</b></div>').join('');
  const cv = F.conv; $('#cb-conv').textContent = cv && cv.n ? 'Últimos 30 dias: ' + cv.n + ' contato' + (cv.n === 1 ? '' : 's') + ', ' + cv.ok + ' paciente' + (cv.ok === 1 ? '' : 's') + ' com consulta marcada depois (' + Math.round(cv.ok / cv.n * 100) + '%).' : 'Ainda não há contatos registrados nos últimos 30 dias.';
  $('#cb-fbody').innerHTML = vis.length ? vis.map(x => {
    const w = CB_WPP[x.whatsapp] || CB_WPP.sem_registro, n = cbDias(x.ultima_visita);
    const c2 = cfg.regua ? (x.regua ? '<span class="pill nu">' + esc((CB_REGUAS.find(r => r[0] === x.regua) || [0, x.regua])[1]) + '</span> ' + (x.valor_atraso != null ? reais(x.valor_atraso) : '') : '—')
      : x.ultima_visita ? dBR(x.ultima_visita) + ' <small style="color:var(--muted)">há ' + n + ' d</small>' : '<span style="color:var(--muted)">Sem atendimento</span>';
    return '<tr><td><button class="link" type="button" data-pac="' + x.paciente_id + '" data-nm="' + esc(x.nome) + '">' + esc(cbCap(x.nome)) + '</button><br><small style="color:var(--muted)">' + esc(x.status) + '</small></td><td>' + (x.telefone ? mTel(x.telefone) + waIc(x.telefone, x.nome) : '—') + '</td><td><span class="pill ' + w[0] + '">' + w[1] + '</span></td><td>' + c2 + '</td><td>' + cbUltimo(x) + '</td><td>' + cbAcao(x, cobMsg(cfg.tpl, x, cfg.extra)) + '</td></tr>';
  }).join('') : '<tr><td colspan="6" class="vazio">' + (d.length ? 'Todos os pacientes desta lista já receberam mensagem recentemente.' : (cfg.vazio || 'Nenhum paciente nesta lista. Bom sinal.')) + '</td></tr>';
}
async function cbSemAg(){

/* ----- Faltas: controle diário e mensal + lista para recuperar o paciente ----- */
const mesIni = (h, d) => { const a = Number(h.slice(0, 4)), m = Number(h.slice(5, 7)) + (d || 0), dt = new Date(a, m - 1, 1); return iso(dt); };
const mesFim = ini => { const dt = dataLocal(ini); return iso(new Date(dt.getFullYear(), dt.getMonth() + 1, 0)); };
async function cbFaltas(ini, fim){
  const h = hoje(); if (!CBX.fl) CBX.fl = { ini: mesIni(h), fim: h, res: [], lista: [], q: '', so: true };
  const L = CBX.fl; if (ini) { L.ini = ini; L.fim = fim; }
  $('#area').innerHTML = cbCabeca('Controle de faltas por dia e por mês, e a lista de quem faltou para chamar de volta e remarcar.') + '<div class="card"><p class="sub">Carregando...</p></div>';
  const rs = await Promise.all([sb.rpc('faltas_resumo', { p_unidade: UN, p_de: L.ini, p_ate: L.fim }), sb.rpc('faltas_cobranca', { p_unidade: UN, p_de: L.ini, p_ate: L.fim })]);
  const er = rs.map(r => r.error).find(Boolean); if (er) { $('#area').innerHTML = cbCabeca('Faltas') + '<div class="card"><div class="err">' + esc(erroTxt(er)) + '</div></div>'; cobAbasLiga(); return; }
  L.res = rs[0].data || []; L.lista = rs[1].data || []; cbFaltasTela();
}
function cbFaltasTela(){
  const L = CBX.fl, h = hoje(), sm = k => L.res.reduce((t, r) => t + Number(r[k]), 0), fal = sm('faltas'), comp = sm('compareceram'), rec = sm('recuperadas'), base = fal + comp;
  const pre = [['Hoje', h, h], ['Ontem', somaDias(h, -1), somaDias(h, -1)], ['Últimos 7 dias', somaDias(h, -6), h], ['Este mês', mesIni(h), h], ['Mês passado', mesIni(h, -1), mesFim(mesIni(h, -1))]];
  $('#area').innerHTML = cbCabeca('Controle de faltas por dia e por mês, e a lista de quem faltou para chamar de volta e remarcar.')
    + '<div class="card"><div class="tools" id="fl-pre">' + pre.map((p, i) => '<button class="btn ' + (L.ini === p[1] && L.fim === p[2] ? '' : 'ghost ') + 'sm" type="button" data-pre="' + i + '">' + p[0] + '</button>').join('') + '</div>'
    + '<form id="fl-form" novalidate><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end"><label class="field" for="fl-ini" style="margin:0">De<input id="fl-ini" type="date" value="' + esc(L.ini) + '"></label><label class="field" for="fl-fim" style="margin:0">Até<input id="fl-fim" type="date" value="' + esc(L.fim) + '"></label><button class="btn" type="submit">Atualizar</button>' + cbConfigBtn() + '</div><div class="err" id="fl-err" role="alert"></div></form>'
    + '<div class="kpis" style="margin-top:14px"><div class="kpi ' + (fal ? 'al' : 'ok') + '"><span>Faltas no período</span><b id="fl-k1">' + fal + '</b></div><div class="kpi"><span>Taxa de falta</span><b id="fl-k2">' + (base ? String(Math.round(fal / base * 1000) / 10).replace('.', ',') + '%' : '—') + '</b></div><div class="kpi"><span>Atendimentos</span><b>' + comp + '</b></div><div class="kpi ok"><span>Voltaram ou remarcaram</span><b id="fl-k3">' + rec + '</b></div></div>'
    + (L.res.length > 1 ? '<h3 style="margin:6px 0 8px;font-size:15px">Dia a dia</h3><div class="rlg" style="max-height:260px"><table class="tb rl"><thead><tr><th>Data</th><th class="n">Agendados</th><th class="n">Atendidos</th><th class="n">Faltas</th><th class="n">% faltas</th><th class="n">Voltaram/remarcaram</th></tr></thead><tbody>'
      + L.res.map(r => { const b = Number(r.faltas) + Number(r.compareceram); return '<tr><td>' + dBR(r.data) + '</td><td class="n">' + r.agendados + '</td><td class="n">' + r.compareceram + '</td><td class="n">' + (r.faltas > 0 ? '<b style="color:var(--red)">' + r.faltas + '</b>' : 0) + '</td><td class="n">' + (b ? Math.round(r.faltas / b * 100) + '%' : '—') + '</td><td class="n">' + r.recuperadas + '</td></tr>'; }).join('')
      + '</tbody><tfoot><tr><td>Total</td><td class="n">' + sm('agendados') + '</td><td class="n">' + comp + '</td><td class="n">' + fal + '</td><td class="n">' + (base ? Math.round(fal / base * 100) + '%' : '—') + '</td><td class="n">' + rec + '</td></tr></tfoot></table></div>' : '')
    + '<h3 style="margin:14px 0 8px;font-size:15px">Quem faltou</h3><div class="tools"><input id="fl-q" type="search" placeholder="Buscar paciente" aria-label="Buscar paciente" value="' + esc(L.q) + '"><label class="chk" style="flex:none"><input type="checkbox" id="fl-so"' + (L.so ? ' checked' : '') + '> Só quem ainda não remarcou</label></div>'
    + '<details style="margin:0 0 10px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Mensagem que será enviada</summary><p id="fl-msg" style="margin:8px 0 0;white-space:pre-wrap;font-size:14.5px"></p></details>'

const pxPMT = (pv, i, n) => i === 0 ? pv / n : pv * i / (1 - Math.pow(1 + i, -n));

  if (entrada < 0 || entrada > avista) return { erro: 'A entrada não pode ser maior que o valor do tratamento.' };
  if (pv <= 0) return { erro: 'A entrada cobre todo o valor: não há o que financiar.' };
  let n, pmt;
  if (modo === 'n') { n = Math.round(valor); if (!(n >= 1 && n <= 120)) return { erro: 'Informe de 1 a 120 parcelas.' }; pmt = r2(pxPMT(pv, i, n)); }

    if (n > 120) return { erro: 'Seriam mais de 120 parcelas: aumente o valor da parcela.' };

}
function clinCustoJs(insumos, preco, c){
  const ins = insumos.reduce((s, x) => s + x.qtd * x.custo_unit, 0), prot = insumos.reduce((s, x) => s + (x.protetico ? x.qtd * x.custo_unit : 0), 0);

}
/* preço ideal: menor valor inteiro cuja margem atinge a margem mínima (mesma conta do banco) */
function clinIdealJs(insumos, c){

function clinTlArrasta(box, aoMover){

  box.querySelectorAll('[data-drag]').forEach(d => {
    const el = d.closest('[data-ex]'), m0 = el.closest('.tlx-c').dataset.m, i0 = ms.indexOf(m0);
    let x0 = null, y0 = 0, alvo = i0;
    const marca = k => cols.forEach((c, n) => c.classList.toggle('alvo', n === k && k !== i0));
    const solta = () => { cols.forEach(c => c.classList.remove('alvo')); el.classList.remove('arr'); el.style.transform = ''; };

  p.innerHTML = '<form class="card" id="au-form" novalidate style="margin:0;border-left:4px solid var(--warn)"><b>Desconto abaixo do mínimo</b><p class="sub" style="margin:4px 0 10px">' + esc(it.servico) + ': ' + brl(v) + ' por unidade (mínimo ' + brl(it.valor_minimo) + '). Só um diretor pode autorizar: peça que ele digite o login e a senha.</p>'
    + '<div class="tools" style="margin:0;align-items:end"><label class="field" for="au-l" style="margin:0">Login do diretor<input id="au-l" autocomplete="off" autocapitalize="none" spellcheck="false" style="width:140px"></label><label class="field" for="au-s" style="margin:0">Senha<input id="au-s" type="password" autocomplete="off" style="width:140px"></label>'
    + '<label class="field" for="au-m" style="margin:0;flex:1;min-width:180px">Motivo<input id="au-m" maxlength="200" placeholder="ex.: paciente antigo, fechou hoje"></label></div><div class="err" id="au-err" role="alert"></div><div class="tools" style="margin:8px 0 0"><button class="btn sm" type="submit" id="au-ok">Autorizar</button><button class="btn ghost sm" type="button" id="au-x">Cancelar</button></div></form>';
  $('#au-l').focus(); $('#au-x').addEventListener('click', () => { p.hidden = true; p.innerHTML = ''; clinOrcDesenha(); });
  $('#au-form').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#au-err'); er.textContent = '';
    const l = $('#au-l').value.trim(), s = $('#au-s').value, m = $('#au-m').value.trim();
    if (!l || !s) { er.textContent = 'Digite o login e a senha do diretor.'; return; }
    if (m.length < 3) { er.textContent = 'Informe o motivo do desconto.'; return; }
    const b = $('#au-ok'); b.disabled = true;
    const tmp = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
    const a = await tmp.auth.signInWithPassword({ email: l.toLowerCase() + '@' + DOMINIO, password: s });
    if (a.error) { b.disabled = false; er.textContent = 'Login ou senha do diretor incorretos.'; return; }
    const r = await tmp.rpc('clin_item_autorizar', { p_item: it.id, p_valor_unit: v, p_motivo: m });
    try { await tmp.auth.signOut({ scope: 'local' }); } catch (x) { /* sessão temporária: some ao fechar */ }
    if (r.error) { b.disabled = false; er.textContent = erroTxt(r.error); return; }
    const r2_ = await sb.rpc('clin_orc_item_set', { p_item: it.id, p_valor_unit: v });
    if (r2_.error) { b.disabled = false; er.textContent = erroTxt(r2_.error); return; }
    toast('Desconto autorizado.'); const g = await sb.rpc('clin_orc_obter', { p_id: CLO.o.id }); if (!g.error) { CLO.o = g.data; clinOrcDesenha(); }
  });
}
async function waCarregar(){
  $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
  const ru = await sb.from('unidades').select('*').order('sigla');
  if (ru.error) { $('#area').innerHTML = '<div class="card"><div class="err">' + esc(erroTxt(ru.error)) + '</div></div>'; return; }
  defUn(ru.data); D.unidades = MINHAS.slice();
  if (!UN) { $('#area').innerHTML = semUn('Comunicação'); return; }
  const rs = await Promise.all([sb.rpc('wa_ler_estado', { p_unidade: UN }), sb.rpc('wa_modelos_listar'), sb.rpc('campanhas_listar')]);
  const er = rs.slice(0, 2).map(r => r.error).find(Boolean);
  if (er) { $('#area').innerHTML = '<div class="card"><div class="err">' + esc(erroTxt(er)) + '</div></div>'; return; }
  WAX.est = rs[0].data || {}; WAX.modelos = rs[1].data || []; WAX.camp = rs[2].error ? [] : (rs[2].data || []);
  if (!WAX.est.pode_gerir && WAX.aba === 'conexao') WAX.aba = 'enviar';
  waTela();
}

function waTela(){

async function waBuscar(){
  const f = WAX.f, er = $('#wa-err'); er.textContent = '';
  f.vde = $('#wa-vde').value.trim(); f.vate = $('#wa-vate').value.trim(); f.semag = $('#wa-semag').checked;
  if (!f.status.length) { er.textContent = 'Escolha ao menos uma situação.'; return; }
  const filtro = { status: f.status }; if (f.regua.length) filtro.regua = f.regua; if (f.vde !== '') filtro.venc_de = Number(f.vde); if (f.vate !== '') filtro.venc_ate = Number(f.vate); if (f.semag) filtro.sem_agendamento = true;
  const b = $('#wa-buscar'); b.disabled = true; const r = await sb.rpc('cobranca_publico', { p_unidade: UN, p_filtro: filtro }); b.disabled = false;
  if (r.error) { er.textContent = erroTxt(r.error); return; }
  WAX.pub = r.data || []; WAX.sel = new Set(WAX.pub.filter(x => !x.bloqueio).map(x => x.paciente_id)); waResultado();
}

/* --- Histórico --- */
async function waHist(){
  if (!WAX.de) { const l = mesLimites(); WAX.de = l[0]; WAX.ate = l[1]; }
  $('#wa-corpo').innerHTML = '<div class="card"><div class="tools" style="flex-wrap:wrap;align-items:end"><label class="field" for="wh-de" style="margin:0">De<input id="wh-de" type="date" value="' + esc(WAX.de) + '"></label><label class="field" for="wh-ate" style="margin:0">Até<input id="wh-ate" type="date" value="' + esc(WAX.ate) + '"></label><button class="btn" type="button" id="wh-ok">Atualizar</button><button class="btn ghost" type="button" id="wh-fila">Enviar a fila agora</button></div><div class="err" id="wh-err" role="alert"></div><div id="wh-lista"><p class="sub">Carregando...</p></div></div>';
  const carregar = async () => {
    const r = await sb.rpc('wa_historico', { p_unidade: UN, p_de: WAX.de || null, p_ate: WAX.ate || null, p_paciente: null });

    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;

}

function agdGrade(cols, h, dt, ags){
  const dd = String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0'), rot = DIA_CURTO[dt.getDay()].toLowerCase() + ' ' + dd;

const atdSeg = x => x.espera_seg == null ? null : x.espera_seg + Math.floor((Date.now() - (AG.atdT || Date.now())) / 1000);

  let l = [];
  const desenha = () => {
    const q = $('#lg-q').value.trim().toLowerCase(), v = l.filter(x => !q || [x.paciente_nome, x.titulo, x.feito_por_nome, x.motivo].some(t => (t || '').toLowerCase().includes(q)));
    $('#lg-lista').innerHTML = v.length ? '<table class="tb"><thead><tr><th>Quando</th><th>Evento</th><th>Paciente</th><th>Horário</th><th>Quem</th></tr></thead><tbody>'
      + v.map(x => '<tr><td style="white-space:nowrap">' + dtHora(x.feito_em) + '</td><td>' + agLogLinha(x) + '</td><td>' + esc(x.paciente_nome || x.titulo || '') + '</td><td style="white-space:nowrap">' + dBR(x.data) + ' ' + hmDe(x.ini_min) + '<br><small style="color:var(--muted)">' + esc(x.agenda_nome || '') + '</small></td><td>' + esc(x.feito_por_nome) + '</td></tr>').join('') + '</tbody></table>'
      + (l.length >= 300 ? '<p class="sub">Mostrando os 300 registros mais recentes. Reduza o período para ver os outros.</p>' : '') : '<p class="sub" style="margin:0">Nenhum registro neste período.</p>';
  };
  const busca = async () => {
    const de = $('#lg-de').value, ate = $('#lg-ate').value; if (!de || !ate) return;
    let q = sb.from('agendamentos_log').select('*').eq('unidade_id', UN).gte('feito_em', de + 'T00:00:00-03:00').lte('feito_em', ate + 'T23:59:59-03:00').order('feito_em', { ascending: false }).limit(300);
    if ($('#lg-ev').value) q = q.eq('evento', $('#lg-ev').value);
    const r = await q; if (r.error) { $('#lg-lista').innerHTML = '<div class="err">' + esc(erroTxt(r.error)) + '</div>'; return; }
    l = r.data || []; desenha();
  };
  ['#lg-de', '#lg-ate', '#lg-ev'].forEach(i => $(i).addEventListener('change', busca)); $('#lg-q').addEventListener('input', desenha);
  busca();
}
async function agdRemarcar(a, c0){
  const r0 = await sb.from('agendas').select('id,nome,tipo,principal').eq('unidade_id', AG.un).eq('ativa', true).order('ordem');
  const pr = AG.procs.find(p => p.id === a.procedimento_id);
  const l = (r0.data || []).filter(x => !pr || agCabe(pr, x));
  abrirJanela('Remarcar',
    '<form id="r-form" novalidate><div class="db"><p style="margin:0"><b>' + esc(a.tipo === 'paciente' ? a.paciente_nome : a.titulo) + '</b> · ' + minTxt(a.dur_min) + '</p>'
    + '<div class="g3"><label class="field" for="r-data">Data<input id="r-data" type="date" min="' + hoje() + '" value="' + esc(AG.data) + '"></label>'
    + '<label class="field" for="r-ag">Agenda<select id="r-ag">' + l.map(x => '<option value="' + x.id + '"' + (x.id === a.agenda_id ? ' selected' : '') + '>' + esc(x.nome) + '</option>').join('') + '</select></label>'
    + '<label class="field" for="r-hora">Horário<input id="r-hora" type="time" step="900" value="' + hmDe(a.ini_min) + '"></label></div>'
    + fld('r-motivo', 'Motivo <small>(opcional, fica no histórico)</small>', '', 'maxlength="120" autocomplete="off"')
    + '<div class="err" id="r-err" role="alert"></div></div><div class="df"><button class="btn ghost" type="button" id="r-cancel">Voltar</button><button class="btn" type="submit" id="r-ok">Remarcar</button></div></form>');
  $('#r-cancel').addEventListener('click', () => agdDetalhe(a.id));
  $('#r-form').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#r-err'); er.textContent = '';
    const d = $('#r-data').value, hm = $('#r-hora').value;
    if (!d || !hm) { er.textContent = 'Informe a data e o horário.'; return; }
    if (d < hoje() || (d === hoje() && minDe(hm) < agoraMin())) { er.textContent = 'Esse horário já passou. Escolha um horário a partir de agora.'; return; }
    const b = $('#r-ok'); b.disabled = true;
    const r = await sb.rpc('reagendar', { p_id: a.id, p_agenda: Number($('#r-ag').value), p_data: d, p_ini: minDe(hm), p_motivo: $('#r-motivo').value.trim() || null });
    b.disabled = false; if (r.error) { er.textContent = erroTxt(r.error); return; }
    fecharJanela(); toast('Remarcado para ' + dBR(d) + ' às ' + hm + '.'); if (d !== AG.data) { AG.data = d; agdDesenhar(); } else agdCorpo();
  });
}
async function agdAbrirCadeira(un){
  const [ra, rd] = await Promise.all([sb.from('agendas').select('id,nome,tipo,ativa,ordem').eq('unidade_id', un.id).eq('ativa', true).eq('tipo', 'cadeira').order('ordem'), sb.rpc('dentistas_da_unidade', { p_unidade: un.id })]);
  const abertas = new Set((AG.cols || []).map(c => c.agenda_id)), ch = (ra.data || []).filter(x => !abertas.has(x.id)), dn = (rd.data || []).filter(x => x.ortodontista);
  abrirJanela('Abrir outra cadeira', '<form id="o-form" novalidate><div class="db"><p style="margin:0">' + esc(dataLocal(AG.data).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</p>'
    + (ch.length ? '<label class="field" for="o-cad">Cadeira<select id="o-cad">' + ch.map(x => '<option value="' + x.id + '">' + esc(x.nome) + '</option>').join('') + '</select></label>'
      + '<label class="field" for="o-den">Dentista que assume<select id="o-den">' + (dn.length ? dn.map(x => '<option value="' + x.id + '">' + esc(x.nome) + '</option>').join('') : '<option value="">Nenhum ortodontista nesta unidade</option>') + '</select></label>'
      + fld('o-motivo', 'Motivo <small>(opcional, ex.: agenda cheia)</small>', '', 'maxlength="80" autocomplete="off"')
      : '<p class="sub" style="margin:0">Todas as cadeiras cadastradas já estão abertas neste dia.</p>')
    + '<div class="err" id="o-err" role="alert"></div></div><div class="df"><button class="btn ghost" type="button" id="o-cancel">Voltar</button>' + (ch.length ? '<button class="btn" type="submit" id="o-ok">Abrir cadeira</button>' : '') + '</div></form>');
  $('#o-cancel').addEventListener('click', fecharJanela);
  $('#o-form').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#o-err'); er.textContent = '';
    if (!ch.length) return; const den = Number($('#o-den').value) || null; if (!den) { er.textContent = 'Escolha o dentista.'; return; }
    const b = $('#o-ok'); b.disabled = true;
    const r = await sb.rpc('definir_substituicao', { p_agenda: Number($('#o-cad').value), p_data: AG.data, p_dentista: den, p_motivo: $('#o-motivo').value.trim() || null });
    b.disabled = false; if (r.error) { er.textContent = erroTxt(r.error); return; }
    fecharJanela(); toast('Cadeira aberta neste dia.'); agdDesenhar();
  });
}
function agdSubstituir(c, un){
  abrirJanela('Substituir neste dia', '<form id="s-form" novalidate><div class="db"><p style="margin:0"><b>' + esc(c.nome) + '</b> · ' + esc(dataLocal(AG.data).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</p>'
    + '<p class="sub" style="margin:0">Isso vale só para este dia. Nos demais dias, a cadeira segue a escala do cadastro dos dentistas.</p>'
    + '<label class="chk"><input type="radio" name="s-modo" value="outro" checked> Outro dentista atende neste dia</label>'
    + '<label class="field" for="s-den">Dentista<select id="s-den"><option value="">Carregando...</option></select></label>'
    + '<label class="chk"><input type="radio" name="s-modo" value="nenhum"> Sem atendimento neste dia (agenda fechada)</label>'
    + fld('s-motivo', 'Motivo <small>(opcional, ex.: férias, atestado)</small>', '', 'maxlength="80" autocomplete="off"')
    + '<div class="err" id="s-err" role="alert"></div></div><div class="df"><button class="btn ghost" type="button" id="s-cancel">Cancelar</button><button class="btn" type="submit" id="s-ok">Salvar</button></div></form>');
  sb.rpc('dentistas_da_unidade', { p_unidade: un.id }).then(r => {
    const l = (r.data || []).filter(x => x.id !== c.responsavel_id);
    if ($('#s-den')) $('#s-den').innerHTML = l.length ? '<option value="">Escolha...</option>' + l.map(x => '<option value="' + x.id + '">' + esc(x.nome) + (x.ortodontista ? ' (orto)' : '') + '</option>').join('') : '<option value="">Nenhum outro dentista nesta unidade</option>';
  });
  $$('input[name="s-modo"]').forEach(i => i.addEventListener('change', () => { $('#s-den').disabled = $('input[name="s-modo"]:checked').value === 'nenhum'; }));
  $('#s-cancel').addEventListener('click', fecharJanela);
  $('#s-form').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#s-err'); er.textContent = '';
    const nenhum = $('input[name="s-modo"]:checked').value === 'nenhum', den = Number($('#s-den').value) || null;
    if (!nenhum && !den) { er.textContent = 'Escolha o dentista que vai atender.'; return; }
    const b = $('#s-ok'); b.disabled = true;
    const r = await sb.rpc('definir_substituicao', { p_agenda: c.agenda_id, p_data: AG.data, p_dentista: nenhum ? null : den, p_motivo: $('#s-motivo').value.trim() || null });
    b.disabled = false; if (r.error) { er.textContent = erroTxt(r.error); return; }
    fecharJanela(); toast('Agenda do dia atualizada.'); agdDesenhar();
  });
}

iniciar();
})();
