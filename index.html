<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orto Gestão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2216%22%20fill=%22%230b0b0b%22/%3E%3Cpath%20d=%22M32%2012a20%2020%200%201%200%2020%2020%22%20fill=%22none%22%20stroke=%22%23ff6a00%22%20stroke-width=%228%22%20stroke-linecap=%22round%22/%3E%3Cpath%20d=%22M45%2011v14M38%2018h14%22%20stroke=%22%23fff%22%20stroke-width=%225%22%20stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f2; --surface:#ffffff; --surface-2:#efede9; --ink:#141414; --muted:#6b6862; --line:#e3e0da;
  --accent:#ff6a00; --accent-ink:#0b0b0b; --accent-text:#bf4b00; --accent-soft:#fff0e3; --side:#0b0b0b; --side-ink:#e9e7e3; --side-muted:#8a8680;
  --red:#c62828; --red-soft:#fdeaea; --ok:#1b7a3d; --ok-soft:#e3f5e8; --warn:#9a5b00; --warn-soft:#fff2d9;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 24px rgba(20,20,20,.07);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e0e0e; --surface:#181818; --surface-2:#232323; --ink:#f3f1ed; --muted:#a29e97; --line:#2c2c2c;
    --accent:#ff7a1a; --accent-ink:#0b0b0b; --accent-text:#ff9140; --accent-soft:#34200f; --side:#050505; --side-ink:#e9e7e3; --side-muted:#7d7a74;
    --red:#ff8a80; --red-soft:#3a1c1c; --ok:#6fdc8c; --ok-soft:#14301d; --warn:#ffc266; --warn-soft:#3a2b0d;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
h1{font:700 24px/1.2 var(--font);letter-spacing:-.02em;margin:0}
h2{font:650 17px/1.25 var(--font);margin:0 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
button{font-family:inherit}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 14px var(--font);padding:0 18px;min-height:42px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)} .btn.ghost:hover{filter:none;background:var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)} .btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.err{color:var(--red);font-size:13.5px;min-height:1px;margin-top:6px} .err:empty{display:none}
.ok-msg{color:var(--ok);font-size:13.5px}

/* login */
#v-login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 85% -10%,rgba(255,106,0,.28),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(255,106,0,.14),transparent 60%),#0b0b0b}
.login{--surface:#151515;--surface-2:#242424;--ink:#f5f3ef;--muted:#a9a59e;--line:#303030;--accent:#ff6a00;width:100%;max-width:410px;background:#151515;color:var(--ink);border-radius:26px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid #2a2a2a}
.login h1{font-size:30px}
.mark{display:block;flex:none}
.login .mark{width:56px;height:56px;margin-bottom:22px}
.wm{font-weight:800;letter-spacing:-.035em}.wm i{font-style:normal;font-weight:500;color:var(--accent)}
.login h1{margin-bottom:4px}
.form{display:grid;gap:14px;margin-top:22px}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font:400 15px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;min-height:44px;padding:9px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field input[readonly]{background:var(--surface-2)}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.pw{position:relative} .pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:6px;min-height:32px;border:0;background:var(--surface-2);color:var(--ink);border-radius:8px;padding:0 10px;font:600 12px var(--font);cursor:pointer}

/* shell */
#v-app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand .mark{width:36px;height:36px}.brand .wm{font-size:19px;color:#fff}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--side-ink);font:500 14.5px var(--font);padding:0 12px;min-height:42px;border-radius:10px;cursor:pointer;text-align:left}
.item:hover{background:rgba(255,255,255,.07)} .item[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.item.soon{opacity:.5;cursor:default}.item.soon:hover{background:transparent}
.item .tag{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:99px}
.side .eu{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side .eu b{display:block;color:#fff;font-size:14px}.side .eu span{color:var(--side-muted)}
.side .eu button{margin-top:10px;width:100%}
.main{min-width:0;padding:26px clamp(16px,3vw,36px) 60px}
.bar{display:none}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:20px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input,.tools select{font:400 14.5px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;min-height:42px;padding:0 12px}
.tools input{flex:1 1 220px;min-width:0}
.lista{display:grid}
.row{display:grid;grid-template-columns:90px minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 6px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%;border-radius:0}
.row:first-child{border-top:0}.row:hover{background:var(--surface-2)}
.row.f{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto}
.row .m{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig{font:700 13px var(--font);background:var(--accent-soft);color:var(--accent-text);padding:5px 10px;border-radius:8px;text-align:center;justify-self:start}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--red-soft);color:var(--red)} .pill.wr{background:var(--warn-soft);color:var(--warn)} .pill.nu{background:var(--accent-soft);color:var(--accent-text)}
.vazio{padding:34px 10px;text-align:center;color:var(--muted)}
.tres{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.tres .card{display:grid;gap:6px}.tres .card svg{width:26px;height:26px;stroke:var(--accent-text);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* janelas */
dialog{border:0;border-radius:20px;padding:0;width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 20px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,18,22,.55)}
/* transições suaves (só opacidade/posição; desligam com "reduzir movimento") */
:root{--ease:cubic-bezier(.22,.8,.3,1)}
dialog{opacity:0;transform:translateY(24px) scale(.96);transition:opacity .25s var(--ease),transform .3s var(--ease),overlay .3s allow-discrete,display .3s allow-discrete}
dialog[open]{opacity:1;transform:none}
@starting-style{dialog[open]{opacity:0;transform:translateY(24px) scale(.96)}}
dialog::backdrop{background:rgba(8,18,22,0);backdrop-filter:blur(0);transition:background .3s,backdrop-filter .3s,overlay .3s allow-discrete,display .3s allow-discrete}
dialog[open]::backdrop{background:rgba(8,18,22,.55);backdrop-filter:blur(3px)}
@starting-style{dialog[open]::backdrop{background:rgba(8,18,22,0);backdrop-filter:blur(0)}}
.mais{position:relative;display:inline-block}.mais-m{position:absolute;right:0;top:calc(100% + 6px);min-width:240px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20}
.mais-m button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;color:var(--red);cursor:pointer}.mais-m button:hover{background:var(--red-soft)}
.pill.nu{white-space:nowrap}.estornado{text-decoration:line-through;color:var(--muted)}
@keyframes og-sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#area.entra{animation:og-sobe .28s var(--ease) backwards}
#area.entra .row:nth-child(-n+9){animation:og-sobe .4s var(--ease) backwards}
#area.entra .row:nth-child(2){animation-delay:40ms}#area.entra .row:nth-child(3){animation-delay:80ms}#area.entra .row:nth-child(4){animation-delay:120ms}#area.entra .row:nth-child(5){animation-delay:160ms}#area.entra .row:nth-child(6){animation-delay:200ms}#area.entra .row:nth-child(7){animation-delay:240ms}#area.entra .row:nth-child(8){animation-delay:280ms}#area.entra .row:nth-child(9){animation-delay:320ms}
.btn{transition:transform .15s var(--ease),filter .2s,box-shadow .2s}.btn:active{transform:scale(.96)}
.item,.row,.aba .at{transition:background .2s,color .2s}
input,select,textarea{transition:border-color .2s,box-shadow .2s}
.toast{transform:translate(-50%,24px);opacity:0;transition:transform .35s var(--ease),opacity .3s}.toast.v{transform:translate(-50%,0);opacity:1}
@media print{body *{visibility:hidden}#dlg,#dlg *{visibility:visible}#dlg{position:absolute;left:0;top:0;width:100%;max-height:none;box-shadow:none;transform:none;opacity:1;overflow:visible}.noprint,.dx{display:none!important}.db{overflow:visible}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px}
.dx{border:0;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
.db{padding:20px 22px;overflow:auto;flex:1 1 auto;min-height:0;display:grid;gap:16px;align-content:start;grid-auto-rows:max-content}
dialog[open]{display:flex;flex-direction:column;max-height:calc(100dvh - 20px)}
#dlg-c,#dlg-c form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.df{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.df .esq{margin-right:auto;display:flex;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text);font-weight:700;margin:4px 0 -4px}
.hor{display:grid;gap:8px}
.hor .d{display:grid;grid-template-columns:118px repeat(4,minmax(0,1fr)) auto;gap:8px 10px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.hor .d:first-child{border-top:0}
.hor .d .t{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--muted);min-width:0}
.hor .d .link{padding:0 4px;min-height:40px;white-space:nowrap}
.hor .d label.c{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-height:40px;align-self:end}
.hor input[type=time]{font:400 15px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px;width:100%}
.hor input:disabled{opacity:.4}
.chk{display:flex;align-items:center;gap:9px;min-height:38px;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

.und{margin:0 6px 14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;gap:4px;font-size:13px;color:#fff}
.und .ul{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted)}
.und b{font-weight:600;line-height:1.3}
.und select{font:600 14px var(--font);color:#fff;background:#1c1c1c;border:1.5px solid rgba(255,255,255,.18);border-radius:10px;min-height:40px;padding:0 10px;width:100%}
.und select:focus{outline:none;border-color:var(--accent)}
.ver{margin:-16px 0 12px 55px;align-self:flex-start;background:transparent;border:0;padding:2px 6px 2px 0;font:500 11px var(--font);color:var(--side-muted);cursor:pointer;letter-spacing:.03em}
.ver:hover{color:var(--accent)}
.vl{display:grid;gap:14px;max-height:60vh;overflow:auto}.vl b{font-size:14px}.vl small{color:var(--muted);margin-left:8px}.vl p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.modo{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:#1a1a1a;color:#fff;padding:9px clamp(16px,3vw,36px);font-size:13.5px;position:sticky;top:0;z-index:16;border-bottom:2px solid var(--accent)}
.modo[hidden]{display:none}.modo b{color:var(--accent)}.modo .btn{min-height:34px;padding:0 14px;font-size:13px}
.cred{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px 10px;background:var(--surface-2);border-radius:12px;padding:14px;font-size:15px}.cred span{color:var(--muted)}.cred b{font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
/* abas */
.col{min-width:0}
.topo{position:sticky;top:0;z-index:15;display:flex;align-items:flex-end;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);padding:8px clamp(16px,3vw,36px) 0}
.abas{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.aba{display:flex;align-items:center;gap:2px;flex:0 0 auto;max-width:220px;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;color:var(--muted);font:500 13.5px var(--font)}
.aba button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.aba .at{padding:9px 6px 9px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px}
.aba .ax{padding:6px 10px 6px 4px;font-size:16px;line-height:1;border-radius:6px}.aba .ax:hover{color:var(--red)}
.aba:not(.fixa) .at{padding-right:2px}.aba.fixa .at{padding-right:14px}
.aba[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.sino{position:relative;flex:0 0 auto;margin-bottom:6px;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.sino svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sino .bd{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font:700 12px var(--font);display:grid;place-items:center;padding:0 5px}
.sino.toca svg{animation:toca .9s ease 2}
@keyframes toca{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
.painel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column}
.painel[hidden]{display:none}
.painel .ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-size:16px}
.painel .dx{font-size:24px;background:transparent;border:0;cursor:pointer;color:var(--muted);min-width:40px;min-height:40px}
#painel-c{overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.avc{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:6px;background:var(--surface)}
.avc.meu{border-color:var(--accent)}
.avc b{font-size:15px}.avc .m{color:var(--muted);font-size:13px}
.avc .ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
/* ficha do paciente */
.ficha{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:16px;align-items:start}
.ficha .kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 12px;align-items:center;font-size:14px}
.ficha .kv span{color:var(--muted)}.ficha .kv b{font-weight:500;overflow-wrap:anywhere}
.tit{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.tit h1{margin:0;font-size:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--accent-soft)}
.pls span,.pls button{border:1.5px solid var(--line);border-radius:99px;padding:6px 16px;font:inherit;font-size:13px;color:var(--muted);background:transparent}
.pls button{cursor:pointer;color:var(--ink)}
.pls span.on,.pls button.on{background:#5b6672;border-color:#5b6672;color:#fff;font-weight:600}
.oc-t{white-space:nowrap}
.tw{overflow:auto}.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
@media (max-width:900px){.ficha{grid-template-columns:minmax(0,1fr)}.topo{padding:6px 14px 0;top:49px}}

/* agenda */
.agw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-height:calc(100vh - 260px);min-height:260px}
.ag{display:grid;min-width:max-content}
.ag>div{min-width:0}
.ag .hc{position:sticky;top:0;z-index:3;background:var(--surface);padding:8px 8px 0;text-align:center;display:grid;gap:4px;align-content:start;border-left:1px solid var(--line)}
.ag .hc .nm{background:var(--accent-soft);color:var(--accent-text);font-weight:700;border-radius:8px;padding:5px 8px;font-size:14px}
.ag .hc .rs{font-size:12.5px;font-weight:600;text-transform:uppercase;line-height:1.25;min-height:32px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.ag .hc .dd{font-size:12.5px;color:var(--muted)}
.ag .hc .ac{display:flex;gap:10px;justify-content:center;min-height:26px}
.ag .hc .ac .link{padding:2px 4px;font-size:12px}
.ag .hd{position:sticky;top:0;z-index:4;background:var(--surface)}
.ag .dt{background:#4a4a4a;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:4px;position:sticky;top:var(--hh,0px);z-index:3;border-left:1px solid #5a5a5a}
.ag .hr{position:sticky;left:0;z-index:2;background:var(--surface);color:var(--muted);font-size:12.5px;text-align:right;padding:4px 8px 0 0;border-top:1px solid var(--line);height:30px}
.ag .c{border-top:1px solid var(--line);border-left:1px solid var(--line);height:30px;font-size:11px;color:var(--muted);padding:6px 8px;overflow:hidden;white-space:nowrap}
.ag .c.fora{background:#bdbdbd;color:#fff;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-top-color:#b0b0b0}
.ag .c.alm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 6px,var(--surface) 6px,var(--surface) 12px);color:var(--muted);font-weight:600}
.ag .c.fecha{background:var(--surface-2);color:var(--muted);font-weight:600;white-space:normal;line-height:1.2}
.ag .c.livre{cursor:pointer}.ag .c.livre:hover{background:var(--accent-soft)}
.ag .a{position:relative;z-index:1;margin:1px 3px 0;border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:3px 8px;font:inherit;font-size:12px;line-height:1.25;color:#fff;text-align:left;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;gap:1px;min-width:0}
.ag .a b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ag .a small{opacity:.88;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ag .a:hover{filter:brightness(1.25)}.ag .a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.s-agendado{background:#111}.s-compareceu{background:#1b8a4b}.s-em_atendimento{background:#1769d6}.s-faltou{background:#d4271c}.s-concluido{background:#7a7a7a}
.ag .a.cp{background-image:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.09) 7px 14px)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(128,128,128,.4)}
.pk{display:grid;gap:2px;max-height:170px;overflow:auto;border:1.5px solid var(--line);border-radius:11px;padding:4px}
.pk button{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pk button:hover,.pk button[aria-pressed=true]{background:var(--accent-soft)}
.pk .v{padding:10px;color:var(--muted);font-size:13.5px}
.dkv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:14px}.dkv span{color:var(--muted)}.dkv b{font-weight:500;overflow-wrap:anywhere}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
@media (prefers-color-scheme: dark){.ag .c.fora{background:#3a3a3a;border-top-color:#444}}
.agbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.agbar select,.agbar input[type=date]{font:400 14.5px var(--font);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;min-height:42px;padding:0 12px}
.agbar .nav{display:flex;gap:6px;align-items:center}
.agbar .nav button{min-width:42px}
.agbar .dl{color:var(--muted);font-size:14px}.agbar .dl::first-letter{text-transform:uppercase}
.chks{display:flex;flex-wrap:wrap;gap:2px 18px}
.uns{display:grid;gap:8px}
.un{border:1.5px solid var(--line);border-radius:12px;padding:4px 12px}
.un-dias{display:flex;flex-wrap:wrap;gap:0 14px;padding:0 0 6px 27px}
.chk.fechado{opacity:.45;cursor:default}
.cred{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.cred code{font:600 16px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
.sen{background:var(--surface-2);border-radius:14px;padding:14px;display:grid;gap:10px}

/* perfis */
.perf{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.pl{display:grid;gap:4px}
.pl button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;color:var(--ink);font:500 14.5px var(--font);padding:0 12px;min-height:44px;border-radius:11px;cursor:pointer;text-align:left}
.pl button:hover{background:var(--surface-2)}.pl button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.mod{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:2px}
.mod:first-of-type{border-top:0}
.mod .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:650}
.link{border:0;background:none;color:var(--accent-text);font:600 13px var(--font);cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;bottom:24px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

@media (max-width:900px){
  #v-app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-102%);transition:transform .22s}
  #v-app.aberto .side{transform:none;box-shadow:0 0 0 100vmax rgba(8,18,22,.5)}
  .bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px}
  .bar button{border:0;background:var(--surface-2);color:var(--ink);width:42px;height:42px;border-radius:11px;font-size:20px;cursor:pointer}
  .main{padding:18px 14px 60px}
  .row,.row.f{grid-template-columns:minmax(0,1fr) auto}
  .row .m.x{display:none}
  .perf{grid-template-columns:minmax(0,1fr)}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hor .d{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hor .d label.c{grid-column:1/-1}
  .hor .d .link{grid-column:1/-1;justify-self:start}
  .df .esq{width:100%;margin-right:0}
  .df .btn{flex:1}
}
.rlg{overflow:auto;border-radius:inherit}.rl{margin:0;font-size:12.5px}.rl th,.rl td{white-space:nowrap;padding:9px 7px}.rl th{font-size:11px}.rl td .pill{font-size:11px;padding:2px 8px}.rl .n{text-align:right}.rl thead th{position:sticky;top:0;background:var(--surface);z-index:2;box-shadow:0 1px 0 var(--line)}.rl tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:700;z-index:2;box-shadow:0 -1px 0 var(--line)}
.rl .flt th{padding:4px 5px;font-weight:400;background:var(--surface)}.rl .flt input{width:100%;min-width:64px;padding:5px 7px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.rl .th{display:inline-flex;align-items:center;gap:6px}.rl .fx{border:0;background:transparent;color:var(--muted);padding:3px;border-radius:5px;cursor:pointer;line-height:0}.rl .fx:hover{background:var(--surface-2);color:var(--ink)}.rl .fx.on{color:var(--accent-ink);background:var(--accent)}.rl-pop{position:fixed;z-index:80;width:260px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:10px;font-size:13px}.rl-pop .pq input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px}.rl-pop .chk{display:flex;gap:8px;align-items:center;padding:4px 2px;min-height:26px;font-size:13px;font-weight:500}.rl-pop .pl{max-height:210px;overflow:auto;margin:2px 0}.rl-pop .pn{margin:6px 2px;font-size:12px;font-weight:700;color:var(--muted)}.rl-pop .pb{display:flex;gap:8px}
.cbk{display:grid;gap:4px;margin-top:14px}.cbk span{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.cbk1 b{font-size:34px;line-height:1.1;display:block}.cbk2 b{font-size:22px;color:var(--muted);display:block}.cbk3{margin-top:8px}.cbk3 b{font-size:22px;display:block}.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;max-width:520px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}.cbc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}.cbc1{display:grid;gap:3px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}.cbc1 .pill{justify-self:start}.cbc1 b{font-size:13px;font-weight:600;color:var(--muted)}.cbc1 strong{font-size:20px}.cbc1 small{color:var(--muted);font-size:12px}.cbc1.on,.cbc1:hover{border-color:var(--accent)}
</style>

<body>

<div id="v-conf" hidden style="padding:40px 20px;max-width:560px;margin:0 auto">
  <div class="card"><h1>Falta ligar o banco de dados</h1>
  <p class="sub" style="margin-top:8px">Abra o arquivo <b>config.js</b> e preencha o endereço (URL) e a chave pública (anon) do seu projeto no Supabase.</p></div>
</div>

<div id="v-login" hidden>
  <form class="login" id="form-entrar" autocomplete="on" novalidate>
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0b0b0b" stroke="#2b2b2b" stroke-width="1"/><path d="M32 12a20 20 0 1 0 20 20" fill="none" stroke="#ff6a00" stroke-width="8" stroke-linecap="round"/><path d="M45 11v14M38 18h14" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
    <h1><span class="wm">Orto<i> Gestão</i></span></h1>
    <p class="sub">Entre com o seu login e a sua senha.</p>
    <div class="form">
      <label class="field" for="l-login">Login<input id="l-login" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" placeholder="Ex.: abc123"></label>
      <label class="field" for="l-senha">Senha<span class="pw"><input id="l-senha" type="password" autocomplete="current-password"><button type="button" id="l-ver" aria-label="Mostrar senha">Mostrar</button></span></label>
      <div class="err" id="l-err" role="alert"></div>
      <button class="btn" id="l-btn" type="submit">Entrar</button>
    </div>
  </form>
</div>

<div id="v-app" hidden>
  <aside class="side" id="side" aria-label="Menu principal">
    <div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0b0b0b" stroke="#2b2b2b" stroke-width="1"/><path d="M32 12a20 20 0 1 0 20 20" fill="none" stroke="#ff6a00" stroke-width="8" stroke-linecap="round"/><path d="M45 11v14M38 18h14" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><span class="wm">Orto<i> Gestão</i></span></div>
    <button class="ver" id="ver" type="button" title="Registro de versões"></button>
    <div class="und" id="und"></div>
    <nav id="menu"></nav>
    <div class="eu"><b id="eu-nome"></b><span id="eu-perfil"></span><button class="btn ghost sm" id="sair" type="button">Sair</button></div>
  </aside>
  <div class="col">
    <div class="bar"><button type="button" id="abre" aria-label="Abrir menu">☰</button><b id="bar-t"></b></div>
    <div class="modo" id="modo" hidden></div>
    <div class="topo"><div class="abas" id="abas" role="tablist" aria-label="Janelas abertas"></div>
      <button class="sino" id="sino" type="button" hidden aria-label="Avaliações para fazer" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 0 0 4 0"/></svg><span class="bd" id="sino-n" hidden>0</span></button></div>
    <main class="main" id="area" tabindex="-1"></main>
  </div>
</div>
<aside class="painel" id="painel" hidden aria-label="Avaliações para fazer"><div class="ph"><b>Avaliações para fazer</b><button class="dx" type="button" id="painel-x" aria-label="Fechar painel">×</button></div><div id="painel-c"></div></aside>

<dialog id="dlg" aria-labelledby="dlg-t"><div class="dh"><h2 id="dlg-t"></h2><button class="dx" type="button" id="dlg-x" aria-label="Fechar">×</button></div><div id="dlg-c"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C = window.CONFIG || {};
const DOMINIO = C.LOGIN_DOMAIN || 'acesso.orto.app';
let sb = null, EU = null, ROTA = 'inicio';
const D = { unidades: [], perfis: [], permissoes: [], pp: [], func: [], fu: [] };

/* ---------- utilidades ---------- */
const hoje = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const dBR = d => d ? d.split('-').reverse().join('/') : '';
const dig = s => String(s || '').replace(/\D/g, '');
const mCPF = s => { const d = dig(s).slice(0, 11); return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2'); };
const mTel = s => { const d = dig(s).slice(0, 11); if (d.length <= 2) return d ? '(' + d : ''; if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2); if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6); return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7); };
const mCEP = s => { const d = dig(s).slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; };
function cpfOk(p){
  if (!/^\d{11}$/.test(p) || /^(\d)\1{10}$/.test(p)) return false;
  const d = p.split('').map(Number); let s = 0, r;
  for (let i = 0; i < 9; i++) s += d[i] * (10 - i); r = (s * 10) % 11; if (r === 10) r = 0; if (r !== d[9]) return false;
  s = 0; for (let i = 0; i < 10; i++) s += d[i] * (11 - i); r = (s * 10) % 11; if (r === 10) r = 0; return r === d[10];
}
let tt, tt2;
function toast(m){
  const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); clearTimeout(tt2);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('v')));
  tt = setTimeout(() => { t.classList.remove('v'); tt2 = setTimeout(() => { t.hidden = true; }, 380); }, 3800);
}
const sorteio = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
function senhaSugerida(){
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  for (;;) { let s = ''; for (let i = 0; i < 8; i++) s += al[sorteio(al.length)]; if (/[A-Z]/.test(s) && /[a-z]/.test(s) && /\d/.test(s)) return s; }
}
function loginSugerido(nome, usados){
  const stop = ['de', 'da', 'do', 'das', 'dos', 'e'];
  const ini = nome.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/\s+/).filter(w => w && !stop.includes(w)).map(w => w[0]).filter(c => /[a-z]/.test(c)).join('').slice(0, 4) || 'usr';
  const n = 6 - ini.length;
  for (let t = 0; t < 300; t++) { let d = ''; for (let i = 0; i < n; i++) d += sorteio(10); if (!usados.has(ini + d)) return ini + d; }
  return ini + String(Date.now()).slice(-n);
}
const inativoEm = (dt) => !!dt && dt <= hoje();
const erroTxt = e => {
  if (!e) return '';
  if (e.code === '42501' || /row-level security|permission denied|Sem permissão/i.test(e.message || '')) return 'Você não tem permissão para fazer isso.';
  if (e.code === '23505') { const m = e.message || ''; return /sigla/.test(m) ? 'Já existe uma unidade com essa sigla.' : /cpf/.test(m) ? 'Já existe um cadastro com esse CPF.' : /cro/.test(m) ? 'Já existe um dentista com esse CRO.' : /funcionario_id/.test(m) ? 'Esse acesso já está ligado a outro dentista.' : 'Já existe um cadastro igual a esse.'; }
  return e.message || 'Algo deu errado. Tente de novo.';
};
async function chamar(body){
  const { data, error } = await sb.functions.invoke('gestao-funcionarios', { body });
  if (error) {
    try { if (error.context && error.context.json) { const j = await error.context.json(); if (j && j.erro) return { erro: j.erro }; } } catch (_) {}
    return { erro: 'Não foi possível falar com o servidor. Confira se a função está publicada.' };
  }
  if (data && data.erro) return { erro: data.erro };
  return { ok: true, data };
}
const pode = p => !!EU && (EU.acesso_total || EU.permissoes.includes(p));
const ehGer = () => !!EU && !EU.fora && !EU.plataforma && (!!EU.acesso_total || EU.perfil === 'Gerente');
const ehDir = () => !!EU && !!EU.acesso_total && !EU.fora && !EU.plataforma;

/* ---------- janelas ---------- */
const dlg = $('#dlg');
function abrirJanela(titulo, html){ $('#dlg-t').textContent = titulo; $('#dlg-c').innerHTML = html; if (!dlg.open) dlg.showModal(); }
function fecharJanela(){ if (dlg.open) dlg.close(); }
$('#dlg-x').addEventListener('click', fecharJanela);
dlg.addEventListener('click', e => { if (e.target === dlg) fecharJanela(); });

/* ---------- entrar e sair ---------- */
async function iniciar(){
  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || !window.supabase) { $('#v-conf').hidden = false; return; }
  sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  if (data && data.session) { if (!(await entrarNoApp())) { await sb.auth.signOut(); $('#v-login').hidden = false; $('#l-err').textContent = 'Seu acesso está inativo ou ainda não foi liberado.'; } }
  else $('#v-login').hidden = false;
}
async function entrarNoApp(troca){
  const { data, error } = await sb.rpc('meu_acesso');
  if (error || !data) return false;
  if (troca) await guardar();
  const manter = troca ? ABAS.filter(a => a.rota.startsWith('p-')) : [];
  EU = data;
  $('#v-login').hidden = true; $('#v-app').hidden = false;
  $('#eu-nome').textContent = EU.nome; $('#eu-perfil').textContent = EU.perfil || EU.cargo || '';
  ABAS.length = 0; ABA = null; $('#area').replaceChildren(); FILA = Promise.resolve(); ABAS.push(...manter);
  { const ru = await sb.from('unidades').select('*').order('sigla'); UN = null; defUn(ru.data || []); }
  const md = $('#modo');
  if (EU.plataforma && EU.grupo) { md.hidden = false; md.innerHTML = '<span>Modo suporte · você está dentro de <b>' + esc(EU.grupo) + '</b>. O que você fizer aqui é registrado.</span><button class="btn ghost" type="button" id="modo-sai">Voltar ao painel da plataforma</button>'; $('#modo-sai').addEventListener('click', async () => { const r = await sb.rpc('sair_grupo'); if (r.error) { toast(erroTxt(r.error)); return; } await entrarNoApp(true); }); }
  else { md.hidden = true; md.innerHTML = ''; }
  montarMenu(); irPara(EU.fora ? 'p-grupos' : 'inicio'); avIniciar();
  if (!EU.fora) sb.rpc('sou_dentista').then(r => { if (!r.error && EU) { EU.dentista = !!r.data; avDesenhar(); } });
  return true;
}
$('#l-ver').addEventListener('click', () => { const i = $('#l-senha'); const v = i.type === 'password'; i.type = v ? 'text' : 'password'; $('#l-ver').textContent = v ? 'Ocultar' : 'Mostrar'; });
$('#form-entrar').addEventListener('submit', async e => {
  e.preventDefault();
  const login = $('#l-login').value.trim().toLowerCase(), senha = $('#l-senha').value;
  const er = $('#l-err'); er.textContent = '';
  if (!login || !senha) { er.textContent = 'Digite o login e a senha.'; return; }
  const b = $('#l-btn'); b.disabled = true; b.textContent = 'Entrando...';
  const { error } = await sb.auth.signInWithPassword({ email: login + '@' + DOMINIO, password: senha });
  if (error) {
    const m = String(error.message || '');
    er.textContent = /invalid login credentials/i.test(m) ? 'Login ou senha incorretos.' : /not confirmed/i.test(m) ? 'Este acesso ainda não foi confirmado no Supabase (e-mail não confirmado).' : /banned|ban/i.test(m) ? 'Este acesso está bloqueado.' : 'Não foi possível entrar: ' + m;
    b.disabled = false; b.textContent = 'Entrar'; return;
  }
  const ok = await entrarNoApp();
  b.disabled = false; b.textContent = 'Entrar';
  if (!ok) { await sb.auth.signOut(); er.textContent = 'Seu acesso está inativo ou ainda não foi liberado. Fale com a administração.'; return; }
  $('#l-senha').value = '';
});
$('#sair').addEventListener('click', async () => { await sb.auth.signOut(); avParar(); UN = null; MINHAS.length = 0; ABAS.length = 0; ABA = null; $('#area').replaceChildren(); FILA = Promise.resolve(); EU = null; $('#v-app').hidden = true; $('#v-login').hidden = false; $('#v-app').classList.remove('aberto'); $('#l-login').focus(); });

/* ---------- unidade ativa: a pessoa vê uma unidade por vez ---------- */
let UN = null; const MINHAS = [];
function defUn(todas){
  const m = (todas || []).filter(u => u.ativa && (EU.acesso_total || (EU.unidades || []).includes(u.id)));
  MINHAS.length = 0; MINHAS.push(...m);
  if (!MINHAS.some(u => u.id === UN)) { let sv = null; try { sv = Number(localStorage.getItem('og_un_' + (EU.id || EU.login))); } catch (_) {} UN = (MINHAS.find(u => u.id === sv) || MINHAS[0] || {}).id || null; }
  desenhaUn();
}
function desenhaUn(){
  const el = $('#und'), nm = u => esc(u.sigla) + ' — ' + esc(u.razao_social);
  if (EU.fora) { el.innerHTML = '<span class="ul">Plataforma</span><b>' + esc(EU.perfil) + '</b>'; return; }
  if (!MINHAS.length) { el.innerHTML = '<span class="ul">Unidade</span><b>Sem unidade vinculada</b>'; return; }
  if (MINHAS.length === 1) { el.innerHTML = '<span class="ul">Unidade</span><b>' + nm(MINHAS[0]) + '</b>'; return; }
  el.innerHTML = '<label class="ul" for="un-sel">Unidade</label><select id="un-sel">' + MINHAS.map(u => '<option value="' + u.id + '"' + (u.id === UN ? ' selected' : '') + '>' + nm(u) + '</option>').join('') + '</select>';
  $('#un-sel').addEventListener('change', e => trocarUnidade(Number(e.target.value)));
}
const semUn = t => '<div class="head"><h1>' + t + '</h1></div><div class="card"><div class="vazio">' + (pode('unidades.criar') ? 'Nenhuma unidade cadastrada ainda. Cadastre a primeira em Configurações › Unidades.' : 'Você ainda não está vinculado a nenhuma unidade. Peça a um Diretor para vincular você em Funcionários.') + '</div></div>';
function trocarUnidade(id){
  FILA = FILA.then(async () => {
    if (id === UN) return;
    if (ABA) { try { await ABA.pronto; } catch (_) {} }
    UN = id; try { localStorage.setItem('og_un_' + (EU.id || EU.login), String(id)); } catch (_) {}
    desenhaUn(); AV.vistos = null; AV.lista = []; avBuscar();
    const eraFicha = ABA && ABA.rota === 'paciente'; if (eraFicha) $('#area').replaceChildren();
    const resto = ABAS.filter(a => a.rota !== 'paciente'); ABAS.length = 0; ABAS.push(...resto);
    if (eraFicha) mostrar(ABAS.find(a => a.rota === 'prospects') || ABAS[0]); else renderAbas();
    if (precisa(ABA)) recarregar(ABA);
    try { await ABA.pronto; } catch (_) {}
    toast('Unidade: ' + (MINHAS.find(u => u.id === id) || {}).sigla);
  }).catch(() => {});
  return FILA;
}

/* ---------- janelas (abas): cada tela fica aberta em sua aba; trocar de aba não perde nada ---------- */
const ABAS = []; let ABA = null, FILA = Promise.resolve();
const ATUALIZA = new Set(['agenda', 'agendas', 'procedimentos', 'prospects', 'vendas', 'financeiro', 'cobranca', 'caixa', 'solicitacoes', 'tratamentos', 'produtos', 'avaliacoes', 'paciente', 'p-grupos', 'p-grupo', 'p-usuarios', 'p-log']), POR_UNIDADE = new Set(['funcionarios', 'dentistas']);
const precisa = a => ATUALIZA.has(a.rota) || (POR_UNIDADE.has(a.rota) && a.un !== UN);
const recarregar = a => { a.un = UN; a.pronto = Promise.resolve(abrirRota(a.rota, a.opc)).catch(() => {}); return a.pronto; };
function renderAbas(){
  $('#abas').innerHTML = ABAS.map(a => '<div class="aba' + (a.fixa ? ' fixa' : '') + '" role="presentation"><button class="at" type="button" role="tab" data-aba="' + esc(a.chave) + '" aria-selected="' + (a === ABA) + '" title="' + esc(a.titulo) + '">' + esc(a.titulo) + '</button>'
    + (a.fixa ? '' : '<button class="ax" type="button" data-fecha="' + esc(a.chave) + '" aria-label="Fechar ' + esc(a.titulo) + '">×</button>') + '</div>').join('');
  $$('#abas .aba').forEach((d, k) => { const a = ABAS[k]; d.setAttribute('aria-selected', a === ABA); d.querySelector('.at').setAttribute('aria-selected', a === ABA); });
  const at = $('#abas [aria-selected=true].at'); if (at && at.scrollIntoView) at.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function abrirRota(r, o){
  if (r === 'unidades') return uniCarregar();
  if (r === 'funcionarios') return funCarregar();
  if (r === 'dentistas') return denCarregar();
  if (r === 'agendas') return agsCarregar();
  if (r === 'procedimentos') return prcCarregar();
  if (r === 'vendas') return vdCarregar();
  if (r === 'financeiro') return finCarregar();
  if (r === 'cobranca') return cobCarregar();
  if (r === 'caixa') return caixaCarregar();
  if (r === 'solicitacoes') return solCarregar();
  if (r === 'produtos') return ehDir() ? prdCarregar() : void($('#area').innerHTML = '<div class="card"><div class="err">Só o Diretor acessa os produtos e serviços.</div></div>');
  if (r === 'tratamentos') return ehDir() ? trtCarregar() : void($('#area').innerHTML = '<div class="card"><div class="err">Só o Diretor acessa os tipos de tratamento.</div></div>');
  if (r === 'avaliacoes') return avTela();
  if (r === 'agenda') return agdCarregar();
  if (r === 'perfis') return perCarregar();
  if (r === 'prospects') return pacCarregar();
  if (r === 'paciente') return pacFicha(o.id);
  if (r === 'p-grupos') return pgrCarregar();
  if (r === 'p-grupo') return pgrFicha(o.id);
  if (r === 'p-usuarios') return pusCarregar();
  if (r === 'p-log') return plogCarregar();
  telaInicio();
}
async function guardar(){
  if (!ABA) return;
  try { await ABA.pronto; } catch (_) {}
  ABA.y = window.scrollY; ABA.frag.append(...$('#area').childNodes);
}
let ENTRA_T = 0, ENTRA_FIM;
function entrando(){ const ar = $('#area'); ar.classList.remove('entra'); void ar.offsetWidth; ar.classList.add('entra'); clearTimeout(ENTRA_FIM); ENTRA_FIM = setTimeout(() => ar.classList.remove('entra'), 800); }
new MutationObserver(() => { if (Date.now() - ENTRA_T < 1500) entrando(); }).observe(document.getElementById('area'), { childList: true });
function mostrar(a){
  ENTRA_T = Date.now();
  ABA = a; $('#area').replaceChildren(a.frag); window.scrollTo(0, a.y || 0);
  $$('#menu .item').forEach(b => b.dataset.r === a.rota ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  $('#bar-t').textContent = a.titulo; renderAbas();
}
function irPara(r, o){
  $('#v-app').classList.remove('aberto');
  const chave = (o && o.chave) || r;
  FILA = FILA.then(async () => {
    const ja = ABAS.find(x => x.chave === chave);
    if (ja && ja === ABA) return;
    await guardar();
    if (ja) { mostrar(ja); if (precisa(ja)) recarregar(ja); return; }
    const a = { un: UN, chave, rota: r, titulo: (o && o.titulo) || TITULOS[r] || '', frag: document.createDocumentFragment(), fixa: r === 'inicio' || r === 'p-grupos', opc: o || {}, y: 0 };
    ABAS.push(a); ABA = a; $('#area').replaceChildren(); mostrar(a);
    a.pronto = Promise.resolve(abrirRota(r, o || {})).catch(e => { $('#area').innerHTML = '<div class="card"><div class="err">' + esc(erroTxt(e)) + '</div></div>'; });
    await a.pronto;
  }).catch(() => {});
  return FILA;
}
function fecharAba(chave){
  FILA = FILA.then(async () => {
    const k = ABAS.findIndex(x => x.chave === chave); if (k < 0 || ABAS[k].fixa) return;
    const a = ABAS[k];
    if (a === ABA) { try { await a.pronto; } catch (_) {} $('#area').replaceChildren(); ABAS.splice(k, 1); mostrar(ABAS[k - 1] || ABAS[k] || ABAS[0]); const b = ABA; if (precisa(b)) recarregar(b); }
    else { ABAS.splice(k, 1); renderAbas(); }
  }).catch(() => {});
  return FILA;
}
function tituloAba(chave, t){ const a = ABAS.find(x => x.chave === chave); if (a) { a.titulo = t; renderAbas(); if (a === ABA) $('#bar-t').textContent = t; } }
$('#abas').addEventListener('click', e => {
  const f = e.target.closest('[data-fecha]'); if (f) return void fecharAba(f.dataset.fecha);
  const t = e.target.closest('[data-aba]'); if (t) { const a = ABAS.find(x => x.chave === t.dataset.aba); if (a) irPara(a.rota, { ...a.opc, chave: a.chave, titulo: a.titulo }); }
});

  $('#area').innerHTML = '<div class="head"><div><h1>Olá, ' + esc(primeiro) + '!</h1><p class="sub">' + esc(EU.perfil || '') + '</p></div></div>'
    + (sem ? '<div class="card"><h2>Seu perfil ainda não tem telas liberadas</h2><p class="sub">Peça a um Diretor para liberar o que você precisa em Perfis de acesso.</p></div>' : '')

/* ---------- CEP: busca o endereço (base dos Correios, via ViaCEP) ao terminar de digitar ---------- */
async function cepAuto(p, cep){
  const msg = $('#' + p + '-cepmsg'); if (!msg) return;
  msg.textContent = 'Buscando o endereço...';
  try {
    const r = await fetch('https://viacep.com.br/ws/' + cep + '/json/'); const j = await r.json();
    if (dig(($('#' + p + '-cep') || {}).value) !== cep) return;
    if (j.erro) { msg.textContent = 'CEP não encontrado. Confira os números ou preencha o endereço à mão.'; return; }
    [[p + '-log', j.logradouro], [p + '-bai', j.bairro], [p + '-cid', j.localidade]].forEach(([id, v]) => { if (v) $('#' + id).value = v; });
    if (j.uf) $('#' + p + '-uf').value = j.uf;
    msg.textContent = 'Endereço preenchido pelo CEP. Confira e informe o número.';
    const n = $('#' + p + '-num'); if (n && !n.disabled) n.focus();
  } catch (_) { msg.textContent = 'Não consegui consultar o CEP agora. Preencha o endereço à mão.'; }
}

const AG = { un: null, data: null, tk: 0, timer: null, cols: null, ags: [], procs: [] };

const minDe = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const hmDe = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
// o procedimento cabe nesta agenda? (avaliação na Geral · instalação na principal · atendimentos nas auxiliares)
const agCabe = (p, c) => p.local === 'geral' ? c.tipo === 'geral' : p.local === 'principal' ? (c.tipo === 'cadeira' && !!c.principal) : (c.tipo === 'cadeira' && !c.principal);

function agdGrade(cols, h, dt, ags){
  const dd = String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0'), rot = DIA_CURTO[dt.getDay()].toLowerCase() + ' ' + dd;
  const podeSub = pode('agenda.substituir'), podeAg = pode('agendamentos.criar') && AG.data >= hoje();
  let g = '<div class="hc hd" style="border:0;padding:0;grid-row:1;grid-column:1"></div>';
  cols.forEach((c, i) => {
    g += '<div class="hc" style="grid-row:1;grid-column:' + (i + 2) + '"><div class="nm">' + esc(c.nome) + '</div><div class="rs">' + (c.sem_atendimento ? '<span class="pill off">Sem atendimento</span>' : esc(c.dentista_nome || '') + (c.substituicao ? ' <span class="pill wr">Substituição</span>' : '')) + '</div>'
      + '<div class="dd">' + esc(diasTxt(c.dias)) + (c.motivo ? ' · ' + esc(c.motivo) : '') + '</div>'
      + '<div class="ac">' + (podeSub && c.tipo === 'cadeira' ? (c.substituicao || c.sem_atendimento ? '<button class="link" type="button" data-des="' + c.agenda_id + '">Voltar ao responsável</button>' : '<button class="link" type="button" data-sub="' + c.agenda_id + '">Substituir neste dia</button>') : '') + '</div></div>';
  });
  g += '<div class="hr" style="height:auto;border:0;grid-row:2;grid-column:1;top:var(--hh,0px);z-index:4"></div>' + cols.map((c, i) => '<div class="dt" style="grid-row:2;grid-column:' + (i + 2) + '">' + esc(rot) + '</div>').join('');
  const ab = minDe(h.abre), fe = minDe(h.fecha), ai = h.almoco_ini ? minDe(h.almoco_ini) : null, af = h.almoco_fim ? minDe(h.almoco_fim) : null;
  const rw = m => 3 + (m - (ab - 15)) / 15;
  const linha = (m, tipo, texto) => {
    const r = rw(m);
    g += '<div class="hr" style="grid-row:' + r + ';grid-column:1">' + hmDe(m) + '</div>';
    cols.forEach((c, i) => {
      const pos = 'grid-row:' + r + ';grid-column:' + (i + 2);
      if (c.sem_atendimento) { g += '<div class="c fecha" style="' + pos + '">' + (m === ab ? 'Sem atendimento neste dia' : '') + '</div>'; return; }
      const livre = podeAg && !tipo;
      g += '<div class="c ' + tipo + (livre ? ' livre' : '') + '" style="' + pos + '"' + (livre ? ' data-liv="' + c.agenda_id + '" data-m="' + m + '" title="Agendar ' + esc(c.nome) + ' às ' + hmDe(m) + '"' : '') + '>' + (tipo && (i === 0 || tipo !== 'fora') ? esc(texto || '') : '') + '</div>';
    });
  };
  linha(ab - 15, 'fora', 'Antes do expediente');
  for (let m = ab; m < fe; m += 15) {
    if (ai != null && m >= ai && m < af) linha(m, 'alm', m === ai ? 'Intervalo de almoço' : '');
    else linha(m, '', '');
  }
  linha(fe, 'fora', 'Depois do expediente'); linha(fe + 15, 'fora', '');
  ags.forEach(a => {
    const i = cols.findIndex(c => c.agenda_id === a.agenda_id), n = a.dur_min / 15, r = rw(a.ini_min);
    if (i < 0 || r < 3 || a.ini_min + a.dur_min > fe + 30) return;
    const nome = a.tipo === 'paciente' ? a.paciente_nome : a.titulo, proc = a.tipo === 'paciente' ? a.procedimento_nome : 'Compromisso';
    g += '<button type="button" class="a s-' + a.status + (a.tipo === 'compromisso' ? ' cp' : '') + '" style="grid-row:' + r + ' / span ' + n + ';grid-column:' + (i + 2) + '" data-ag="' + a.id + '" title="' + esc(hmDe(a.ini_min) + ' · ' + nome + ' · ' + proc + ' · ' + ST_AG[a.status]) + '"><b>' + hmDe(a.ini_min) + ' ' + esc(nome) + '</b>'
      + (n > 1 ? '<small>' + esc(proc) + ' · ' + ST_AG[a.status] + '</small>' : '') + '</button>';
  });
  return g;
}

    if ($('#s-den')) $('#s-den').innerHTML = l.length ? '<option value="">Escolha...</option>' + l.map(x => '<option value="' + x.id + '">' + esc(x.nome) + (x.ortodontista ? ' (orto)' : '') + '</option>').join('') : '<option value="">Nenhum outro dentista nesta unidade</option>';
  });
  $$('input[name="s-modo"]').forEach(i => i.addEventListener('change', () => { $('#s-den').disabled = $('input[name="s-modo"]:checked').value === 'nenhum'; }));
  $('#s-cancel').addEventListener('click', fecharJanela);
  $('#s-form').addEventListener('submit', async e => {
    e.preventDefault(); const er = $('#s-err'); er.textContent = '';
    const nenhum = $('input[name="s-modo"]:checked').value === 'nenhum', den = Number($('#s-den').value) || null;
    if (!nenhum && !den) { er.textContent = 'Escolha o dentista que vai atender.'; return; }
    const b = $('#s-ok'); b.disabled = true;
    const r = await sb.rpc('definir_substituicao', { p_agenda: c.agenda_id, p_data: AG.data, p_dentista: nenhum ? null : den, p_motivo: $('#s-motivo').value.trim() || null });
    b.disabled = false; if (r.error) { er.textContent = erroTxt(r.error); return; }
    fecharJanela(); toast('Agenda do dia atualizada.'); agdDesenhar();
  });
}

iniciar();
})();
</script>
</body>
</html>
